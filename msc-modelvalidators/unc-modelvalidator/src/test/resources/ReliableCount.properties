# The proposal's own worked UInteger example: an uncertain count with sigma = 1.0
# compared against the crisp literal 5 at 95% confidence. USE's own evaluator puts the
# REAL-valued transition at mu = 6.6448534751573820, so the least admissible INTEGER
# representative is 7 -- the rounding Z3's integer theory performs for free, because the
# representative is declared on the Int sort. Every constant below comes from a monotone
# search through USE's own UInteger.gt path (which widens to UReal.gt), not from a
# separately implemented normal-CDF approximation.
#
#   n = 6   P(n > 5) = 0.8413447404370406   crisp 6 > 5 is TRUE, uncertain reading is not
#   n = 7   P(n > 5) = 0.9772499379857728
#   n = 8   P(n > 5) = 0.9986500327777663

[below]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{6}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active

[belowInactive]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{6}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = inactive

[at]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{7}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active

[above]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{8}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active

# Both integers straddling the real-valued boundary are offered. Only 7 survives, and
# nothing but the Int sort decides that: the linear boundary itself admits 6.6448534752.
[rounding]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{6,7}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active
