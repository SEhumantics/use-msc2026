# Milestone 4.6 -- EXISTS / COVER / UNIFORM scenario profiles.
#
# SCENARIO-ENUMERATION CONVENTION (the proposal's default, made explicit):
# a scenario selects one configured uncertainty for EVERY potentially live U-type
# attribute slot, so the scenario set is the CROSS PRODUCT over those slots. Every
# section below configures ONE UnidentifiedObject slot carrying ONE UReal attribute
# whose _uncertainty domain lists TWO values, so |Sigma_K| = 2 throughout and the
# cross product cannot explode.
#
# The representative (_value) stays in the SNAPSHOT S; the uncertainty (_uncertainty)
# is the SCENARIO s. UNIFORM must reuse one S across every s; COVER may pick a
# different S per s.
#
# The 0.95 quantile USE's own UReal evaluator realises is z = 1.6448534801602364, so
# the satisfying window of ConfidentlyFast and NotConfidentlyVeryFast together is
#   sigma = 0.02 -> mu in [0.3328970696, 0.3928970696)
#   sigma = 0.03 -> mu in [0.3493456044, 0.4093456044)
#   sigma = 0.06 -> mu in [0.3986912088, 0.4586912088)
# Every representative below sits at least 0.017 away from the nearest endpoint, far
# outside any conservative-enclosure boundary band.

# ---------------------------------------------------------------------------
# (a) EXISTS alone succeeds. mu = 0.35 satisfies the sigma = 0.02 window and misses
#     the sigma = 0.06 window entirely, and no other representative is configured, so
#     COVER and UNIFORM must BOTH be refuted.
# ---------------------------------------------------------------------------
[existsOnly]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = exists satisfy

[existsOnlyCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover satisfy

[existsOnlyUniform]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy

# ---------------------------------------------------------------------------
# (b) COVER succeeds with DIFFERENT snapshots per scenario; UNIFORM fails.
#     mu = 0.35 satisfies only sigma = 0.02, mu = 0.42 only sigma = 0.06, and the two
#     windows are disjoint, so no single representative covers both scenarios.
# ---------------------------------------------------------------------------
[coverNotUniformCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover satisfy

[coverNotUniformUniform]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy

# ---------------------------------------------------------------------------
# (c) A genuine shared UNIFORM witness. The sigma = 0.02 and sigma = 0.03 windows
#     overlap on [0.3493456044, 0.3928970696), and mu = 0.37 lies inside both.
# ---------------------------------------------------------------------------
[uniformSharedUniform]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.37}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.03}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy

[uniformSharedCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.37}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.03}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover satisfy

# The same shared representative against a scenario pair it does NOT cover: sigma
# jumps to 0.06, whose window starts at 0.3986912088, so mu = 0.37 fails it. This is
# the negative half of (c) -- UNIFORM only reports success when the ONE snapshot
# really does hold in EVERY scenario.
[uniformSharedRefuted]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.37}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy

# ---------------------------------------------------------------------------
# Targeted modes under a scenario profile: the target is fixed OUTSIDE the scenario
# quantifiers, so every scenario must diagnose the SAME invariant.
# ---------------------------------------------------------------------------
# counterexample(NotConfidentlyVeryFast): that invariant defined-FALSE (i.e. USE is
# at least 95% sure speed > 0.36) while ConfidentlyFast stays true.
#   sigma = 0.02 -> mu >= 0.3928970696 : 0.42 qualifies
#   sigma = 0.06 -> mu >= 0.4586912088 : 0.50 qualifies
[coverTargetedCounterexample]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.42, 0.50}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover counterexample(UnidentifiedObject::NotConfidentlyVeryFast)

# fragile(ConfidentlyFast): crisp erasure accepts 0.31 > 0.30 while USE's uncertain
# reading gives only p = 0.6915 (sigma = 0.02) and p = 0.5662 (sigma = 0.06), both
# below the demanded 0.95. Holds in BOTH scenarios, so UNIFORM succeeds too.
[uniformTargetedFragile]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform fragile(UnidentifiedObject::ConfidentlyFast)

# An UNTARGETED disjunction: two different scenarios could satisfy different
# disjuncts, silently diagnosing different invariants under one aggregate answer.
# Version 1 permits that only with EXISTS.
[untargetedDisjunctionCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover (false(uncertain, UnidentifiedObject::ConfidentlyFast) or false(uncertain, UnidentifiedObject::NotConfidentlyVeryFast))

[untargetedDisjunctionExists]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = exists (false(uncertain, UnidentifiedObject::ConfidentlyFast) or false(uncertain, UnidentifiedObject::NotConfidentlyVeryFast))

# The SAME untargeted disjunction, respelled through `not`. `not (uncertain i is true)` asserts
# exactly "i is F_U or X_U" -- a diagnosis of i -- so these two branches diagnose DIFFERENT
# invariants just as the section above does, and both stronger profiles must refuse them. Spelled
# out for COVER and UNIFORM separately because the proposal states the rule for both.
[negatedUntargetedDisjunctionCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover (not uncertain UnidentifiedObject::ConfidentlyFast is true or not uncertain UnidentifiedObject::NotConfidentlyVeryFast is true)

[negatedUntargetedDisjunctionUniform]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform (not uncertain UnidentifiedObject::ConfidentlyFast is true or not uncertain UnidentifiedObject::NotConfidentlyVeryFast is true)

# The flip side. `not (false(u,A) or false(u,B))` is by De Morgan `not false(u,A) and not
# false(u,B)`: a CONJUNCTION, pinning both invariants in every scenario, so it is genuinely
# target-determinate and must be ACCEPTED and solved rather than refused. mu = 0.37 lies inside
# both the sigma = 0.02 and the sigma = 0.03 window (see (c) above), so both invariants are T_U in
# both scenarios and a witness really exists for the checker to hold the solver to.
[negatedDisjunctionIsAConjunctionCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.37}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.03}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover (not (false(uncertain, UnidentifiedObject::ConfidentlyFast) or false(uncertain, UnidentifiedObject::NotConfidentlyVeryFast)))
