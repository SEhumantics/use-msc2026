# Milestone 4.5's tie trap in the '>=' direction, and a genuine FRAGILE witness.
# At mu = 0.30 = the literal, the crisp comparison 0.30 >= 0.30 is TRUE, while
# USE's own evaluator assigns the uncertain comparison only
# p = 0.4999999994746490, far below the required 0.95. So the erased target is
# defined-TRUE and the U-aware target is defined-FALSE: exactly W_FRAGILE.
#
# The (wrong) "apply the stored UBoolean p >= 0.5 rule to the un-erased
# comparison" shortcut would read the nominal target as FALSE here, because
# USE's normal-CDF approximation lands just under one half at the tie.
[tieFragile]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.30}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablyFastOrEqual = active
query = fragile(UnidentifiedObject::ReliablyFastOrEqual)
