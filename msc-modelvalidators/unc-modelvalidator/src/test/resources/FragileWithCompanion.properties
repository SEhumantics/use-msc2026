# W_FRAGILE(j) conjoins "every OTHER active invariant is U-aware true" onto the
# nominal/U-aware discrepancy. These two sections make that conjunct load-bearing
# rather than decorative: dropping it turns the unsatisfiable section satisfiable.
[companionSatisfiable]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_rank = Set{1,7}
UnidentifiedObject_ReliablyFast = active
UnidentifiedObject_RankIsOne = active
query = fragile(UnidentifiedObject::ReliablyFast)

# No configured rank satisfies RankIsOne, so no snapshot can hold the
# "others are true" conjunct and the fragile query must be UNSAT.
[companionUnsatisfiable]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_rank = Set{7}
UnidentifiedObject_ReliablyFast = active
UnidentifiedObject_RankIsOne = active
query = fragile(UnidentifiedObject::ReliablyFast)
