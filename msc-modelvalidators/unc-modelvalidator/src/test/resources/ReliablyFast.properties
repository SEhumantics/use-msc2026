# The exact tie: the representative equals the literal the invariant compares it
# against. Crisp '>' is FALSE there, so nominal erasure must NOT accept, and the
# invariant is therefore not fragile at all.
[tieFragile]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.30}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablyFast = active
query = fragile(UnidentifiedObject::ReliablyFast)

