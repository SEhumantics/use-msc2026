# Milestone 4.5. Mirrors benchmark/examples/URealThreshold/ReliablyFast.properties
# [nominalErasure] exactly: nominal erasure sees the crisp 0.31 > 0.30 and accepts,
# while USE's own UReal evaluator assigns only p = 0.6914624677876595 and so rejects
# the required 0.95 confidence. Under SATISFY that is correctly UNSAT; under
# fragile(j) it is the discrepancy witness the query exists to find.
[nominalErasure]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablyFast = active

[nominalErasureFragile]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.31}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablyFast = active
query = fragile(UnidentifiedObject::ReliablyFast)

