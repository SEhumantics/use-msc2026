# Multi-candidate VALUE domains, proven-equal singleton uncertainties. Both
# value candidates sit far below B, so the `<` comparison holds for every pair
# and the `>` comparison (whose crossing-point probability is 0 for
# smaller-mean A) holds for none. NOTE: USE activates unmentioned invariants
# by default, so every section below explicitly deactivates the three
# invariants it does not exercise.
[multiValue]
Sensor_min = 1
Sensor_max = 1
Sensor_speedA_value = Set{0.30, 0.55}
Sensor_speedA_uncertainty = Set{0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = inactive
Sensor_uCountTight = inactive
Sensor_aBelowB = active
Sensor_aAboveB = inactive
Sensor_aAtMostB = inactive
Sensor_tightSigma = inactive

# Same shape with the non-strict comparator: le = lt + eq under the
# equal-sigma crossing model, so this holds a fortiori.
[lePath]
Sensor_min = 1
Sensor_max = 1
Sensor_speedA_value = Set{0.30, 0.55}
Sensor_speedA_uncertainty = Set{0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = inactive
Sensor_uCountTight = inactive
Sensor_aAtMostB = active
Sensor_aBelowB = inactive
Sensor_aAboveB = inactive
Sensor_tightSigma = inactive

# THE uncertainty-choice discriminator: A's uncertainty candidates {0.0, 0.05}.
# With u_A = 0.05 the equal-sigma crossing model gives P(A < B) ~ 0.9973 <
# 0.999; with u_A = 0.0 the degenerate branch gives P = 1 - CNDF(-6) ~ 1.0.
# Exactly ONE candidate pair satisfies theta = 0.999, so a correct encoding
# must force the solver to select u_A = 0.0 -- and USE's own re-evaluation of
# any other witness fails.
[uncertaintyChoice]
Sensor_min = 1
Sensor_max = 1
Sensor_speedA_value = Set{0.30}
Sensor_speedA_uncertainty = Set{0.0, 0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = inactive
Sensor_uCountTight = inactive
Sensor_tightSigma = active
Sensor_aBelowB = inactive
Sensor_aAboveB = inactive
Sensor_aAtMostB = inactive

# No candidate pair reaches theta = 0.999 (both sigmas 0.05, means 0.30/0.60:
# P ~ 0.9973 < 0.999), so the tight threshold on the plain model is UNSAT --
# the pair enumeration is not vacuously true.
[tightBelow]
Sensor_min = 1
Sensor_max = 1
Sensor_speedA_value = Set{0.30}
Sensor_speedA_uncertainty = Set{0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = inactive
Sensor_uCountTight = inactive
Sensor_tightSigma = active
Sensor_aBelowB = inactive
Sensor_aAboveB = inactive
Sensor_aAtMostB = inactive

# A range-bound (non-enumerated) uncertainty domain is refused at CONFIGURATION
# READ time (the reader requires paired enumerated component domains), before
# the translation is ever reached.
[rangeUncertainty]
Sensor_min = 1
Sensor_max = 1
Sensor_speedA_value = Set{0.30}
Sensor_speedA_uncertainty_min = 0.0
Sensor_speedA_uncertainty_max = 0.10
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = inactive
Sensor_uCountTight = inactive
Sensor_aBelowB = active
Sensor_aAboveB = inactive
Sensor_aAtMostB = inactive
Sensor_tightSigma = inactive

# The impossible direction, actively enforced: P(A > B) = 0 under the
# crossing-point model for every candidate pair (A's means both sit below
# B's), so the enforced invariant refutes the configuration.
[aboveActive]
Sensor_min = 1
Sensor_max = 1
Sensor_speedA_value = Set{0.30, 0.55}
Sensor_speedA_uncertainty = Set{0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = inactive
Sensor_uCountTight = inactive
Sensor_aAboveB = active
Sensor_aBelowB = inactive
Sensor_aAtMostB = inactive
Sensor_tightSigma = inactive

# UInteger participates through the same pairwise enumeration (the USE
# widening UIntegerValue.lt = toUReal().lt): theta 0.8 admits exactly the
# crisp u_A = 0 pair (P = 1 - CNDF(-1) ~ 0.841), rejecting u_A = 1
# (equal sigmas, P ~ 0.383); the witness must carry u_A = 0.
[uintegerChoice]
Sensor_min = 1
Sensor_max = 1
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountBelow = active
Sensor_aBelowB = inactive
Sensor_aAboveB = inactive
Sensor_aAtMostB = inactive
Sensor_tightSigma = inactive
Sensor_uCountTight = inactive

# Theta 0.9 excludes BOTH pairs (0.841 and 0.383): UNSAT.
[uintegerTight]
Sensor_min = 1
Sensor_max = 1
Sensor_countA_value = Set{2}
Sensor_countA_uncertainty = Set{0, 1}
Sensor_countB_value = Set{3}
Sensor_countB_uncertainty = Set{1}
Sensor_uCountTight = active
Sensor_aBelowB = inactive
Sensor_aAboveB = inactive
Sensor_aAtMostB = inactive
Sensor_tightSigma = inactive
Sensor_uCountBelow = inactive
