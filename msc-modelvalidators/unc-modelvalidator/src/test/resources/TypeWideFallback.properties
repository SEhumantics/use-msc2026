# Section 1 (unnamed): salary has NO per-attribute domain at all. Its candidate
# values come solely from the primitive-type-wide Integer range, exactly as in
# examples/EmployeeInvariants/Employee.properties.
Integer_min = 0
Integer_max = 3

Employee_min = 1
Employee_max = 2

Employee_PositiveSalary = active

# The paired UNSAT companion: the same model, the same invariant, the same
# population -- only the TYPE-WIDE range moves, ending exactly at the boundary
# value PositiveSalary excludes. If the type-wide range were ignored the
# scenario would be satisfiable, so this section is what proves the fallback
# actually CONSTRAINS rather than merely registering a symbol.
[belowThreshold]

Integer_min = -3
Integer_max = 0

Employee_min = 1
Employee_max = 2

Employee_PositiveSalary = active

# Precedence, half one: an explicit ENUMERATED per-attribute domain wins whole.
# 40 is far outside the type-wide range [0,3]; the incumbent's
# AttributeConfigurator.upperBound takes the `domainValues` branch and never
# looks at the type's range, so the witness must be exactly 40 -- not clamped,
# not intersected into unsatisfiability.
[enumeratedWins]

Integer_min = 0
Integer_max = 3

Employee_min = 1
Employee_max = 1

Employee_salary = Set{40}

Employee_PositiveSalary = active

# Precedence, half two: explicit per-attribute BOUNDS win the same way. This is
# the mutation-sensitive half -- intersecting [50,50] with the type-wide [0,3]
# empties the domain and turns this section UNSAT.
[boundsWin]

Integer_min = 0
Integer_max = 3

Employee_min = 1
Employee_max = 1

Employee_salary_min = 50
Employee_salary_max = 50

Employee_PositiveSalary = active
