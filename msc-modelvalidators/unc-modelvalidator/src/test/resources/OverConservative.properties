# THESIS_SMT_MODEL_FINDER_PLAN.md 5.2's second "query the incumbent cannot state":
# nominal j is false and uncertain j is true -- an over-conservative requirement,
# where nominal erasure REJECTS what uncertainty-aware evaluation accepts.
#
# With sigma = 0.02 and a 0.05 confidence demand, mu = 0.28 gives USE's own
# evaluator p = 0.1586552596 >= 0.05, so the U-aware target is defined-TRUE,
# while the crisp erasure 0.28 > 0.30 is defined-FALSE.
[overConservative]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.28}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_OverConservative = active
query = nominal UnidentifiedObject::OverConservative is false and uncertain UnidentifiedObject::OverConservative is true
