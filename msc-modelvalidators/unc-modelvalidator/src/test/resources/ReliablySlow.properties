# For sigma=0.02, P(speed < 0.30) reaches 0.95 at approximately
# mu = 0.30 - 0.02 * inverseCNDF(0.95) = 0.2671029304. The three values
# straddle the real USE evaluator transition after reconstruction to ten places.
[boundaryBelowActive]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.2671029303}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablySlow = active

[boundaryAtActive]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.26710293039679527282714843750}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablySlow = active

[boundaryAboveInactive]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.2671029305}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablySlow = inactive

[boundaryAboveActive]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.2671029305}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablySlow = active

# Milestone 4.5's tie trap in the '<' direction. At mu = 0.30 = the literal, the
# crisp comparison 0.30 < 0.30 is FALSE, but USE's own evaluator assigns the
# uncertain comparison p = 0.5000000005253510 -- so the (wrong) "apply the stored
# UBoolean p >= 0.5 rule to the un-erased comparison" shortcut would call this
# nominally TRUE. Only the crisp reading is correct.
[tieNominalFalse]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.30}
UnidentifiedObject_speed_uncertainty = Set{0.02}
UnidentifiedObject_ReliablySlow = active
query = false(nominal, UnidentifiedObject::ReliablySlow) and false(uncertain, UnidentifiedObject::ReliablySlow)
