# The SMT solver this module is pinned to. Both values are asserted at runtime; a mismatch is a
# hard failure, never a warning. See output/THESIS_SMT_MODEL_FINDER_PLAN.md section 1.3.
#
# solver.path may be absolute, a bare executable name resolved against PATH, or — as here —
# a path relative to the repository root, which is found by walking up from the working
# directory. The relative form is what makes this work under both `mvn` from the repo root
# and Surefire, whose working directory is the module directory.
solver.path = tools/z3/bin/z3
solver.expectedVersion = 5.1.0
