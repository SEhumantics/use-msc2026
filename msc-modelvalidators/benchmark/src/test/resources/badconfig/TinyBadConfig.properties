# [bad]: AB names "doesnotexist" as B's link partner, but B's own Set{} literal below only ever
# declares "b1" -- PropertyConfigurationVisitor.checkComplexElement has no match for it and no
# numeric-suffix fallback applies ("doesnotexist" does not start with "b"), so it records a real
# config error and containErrors() returns true. See TinyBadConfig.use's header for why this fixture
# exists.
[bad]
A_min = 1
A_max = 1
A = Set{a1}
A_i = Set{1}

B_min = 1
B_max = 1
B = Set{b1}

AB = Set{(a1,doesnotexist)}

# [good]: the same model, configured cleanly, so the test suite also has a same-fixture control
# case proving TinyBadConfig.use itself is not what's broken -- only the [bad] section's
# association line is.
[good]
A_min = 1
A_max = 1
A = Set{a1}
A_i = Set{1}

B_min = 1
B_max = 1
B = Set{b1}

AB = Set{(a1,b1)}
