# -----------------------------------------------------------------------
# UnionNav.properties -- bounds for the derived-union navigation scenarios.
# ab's own _min/_max are deliberately NOT configured: a union role's content
# is derived live from its subsetting associations (cd, ef), so a bound on
# it would promise something the semantics do not deliver (USE core ignores
# such bounds for navigation -- Subsets.properties finding 2).
#
# [main]: cd links (c1,d1); ef empty. cSeesDPartner (c.b notEmpty) is
# SATISFIABLE via the derived union; eSeesNothingWhenOnlyCdLinked (e.b
# isEmpty) holds because cd's C-D links are invisible to an E source.
#
# [unsat]: cd and ef both empty. cSeesDPartner demands a non-empty derived
# union from an empty pair of subsetting associations: UNSATISFIABLE.
# -----------------------------------------------------------------------

[main]

A_min = 0
A_max = 0
B_min = 0
B_max = 0

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

E_min = 1
E_max = 1
E = Set{e1}

F_min = 1
F_max = 1
F = Set{f1}

cd = Set{(c1,d1)}

cd_min = 1
cd_max = 1
ef_min = 0
ef_max = 0

C_cSeesDPartner = active
E_eSeesNothingWhenOnlyCdLinked = active

[unsat]

A_min = 0
A_max = 0
B_min = 0
B_max = 0

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

E_min = 1
E_max = 1
E = Set{e1}

F_min = 1
F_max = 1
F = Set{f1}

cd_min = 0
cd_max = 0
ef_min = 0
ef_max = 0

C_cSeesDPartner = active
E_eSeesNothingWhenOnlyCdLinked = inactive
