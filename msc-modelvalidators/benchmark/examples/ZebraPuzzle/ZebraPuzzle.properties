# ZebraPuzzle.properties -- Kodkod ModelValidator bounds for ZebraPuzzle.use
#
# Authored from scratch for this thesis project (msc-4, Trong-Nghia Be); no
# upstream .properties exists for this model. Exactly 5 House objects (the
# puzzle has no other population -- neither more nor fewer houses makes
# sense), positions bounded to the arithmetic range actually reachable by
# the clues' "position +/- 1" expressions (0..6, not just 1..5), and every
# one of the 22 invariants (6 all-different + 15 named clues + Clue16, the
# derived corollary added alongside the paired UNSAT mutation, "there are
# five houses" folded into House_min/max) active. No enumerated Set{}
# literals are needed for the five enum-typed attributes (color,
# nationality, drink, smoke, pet) -- their domains are already exactly the
# 5 declared enum literals each, per ZebraPuzzle.use.

Integer_min = 0
Integer_max = 6

House_min = 5
House_max = 5

House_PositionRange = active
House_DistinctPosition = active
House_DistinctColor = active
House_DistinctNationality = active
House_DistinctDrink = active
House_DistinctSmoke = active
House_DistinctPet = active

House_Clue02_EnglishmanRedHouse = active
House_Clue03_SpaniardOwnsDog = active
House_Clue04_CoffeeInGreenHouse = active
House_Clue05_UkrainianDrinksTea = active
House_Clue06_GreenRightOfIvory = active
House_Clue07_OldGoldOwnsSnails = active
House_Clue08_KoolsInYellowHouse = active
House_Clue09_MilkInMiddleHouse = active
House_Clue10_NorwegianFirstHouse = active
House_Clue11_ChesterfieldsNextToFox = active
House_Clue12_KoolsNextToHorse = active
House_Clue13_LuckyStrikeDrinksOJ = active
House_Clue14_JapaneseSmokesParliaments = active
House_Clue15_NorwegianNextToBlue = active

# ---------------------------------------------------------------------------
# [clue10_contradiction] -- deliberately UNSATISFIABLE, paired with the
# default section above. Same model (ZebraPuzzle.use, unmodified except for
# one NEW, genuinely-derived invariant -- see below), same population (5
# Houses, all 6 all-different invariants + all 14 original clues active,
# nothing zeroed out or emptied), one deliberate contradiction.
#
# This is NOT a trivial "class bound set to 0" / empty-universe UNSAT (the
# review this benchmark suite is built against explicitly warns against
# that shape). The universe is populated exactly as normally as the SAT
# section above -- the contradiction is a genuine invariant-level clash
# between Clue10 and one new invariant that is DIRECTLY, PROVABLY derived
# from Clue10 itself.
#
# THE CONTRADICTION, traced by hand (not just observed empirically):
#
# ZebraPuzzle.use now carries one invariant beyond the puzzle's original 14
# clues: Clue16_FirstHouseIsNorwegian_Corollary
#   (self.position = 1 implies self.nationality = #Norwegian)
# -- the converse of Clue10_NorwegianFirstHouse
#   (self.nationality = #Norwegian implies self.position = 1).
#
# Clue16 is a direct, provable logical CONSEQUENCE of Clue10 alone, given
# only the bijection structure already forced by DistinctPosition/
# DistinctNationality + House_min=House_max=5 (an injective map between two
# 5-element sets of equal size is automatically a bijection, not merely an
# injection -- both `position` and `nationality` are therefore bijections
# between the 5 Houses and their respective 5-value domains):
#   1) exactly one House has nationality=#Norwegian (call it hN) -- the
#      nationality bijection;
#   2) hN.position = 1 -- Clue10, applied to hN;
#   3) exactly one House has position=1 (call it h1) -- the position
#      bijection;
#   4) hN.position = 1 = h1.position, and position is injective, so hN=h1
#      (the same House object) -- therefore h1.nationality = #Norwegian.
# This chain only needs Clue10 + the two bijection invariants; none of the
# other 13 named clues participate. So Clue16 is TRUE (and redundant)
# wherever Clue10 already holds -- confirmed by re-running the default,
# unnamed section above completely UNCHANGED after adding Clue16 to
# ZebraPuzzle.use: still SATISFIABLE, `check -v` shows Clue16 among the 22
# invariants checked, all OK (see validate.cmd). Clue16 does not change
# that section's outcome at all -- it is exactly the kind of "supplementary,
# already-implied invariant" this repo's Genealogy example (constraint
# implication use case) also demonstrates.
#
# Negating Clue16 HERE, with Clue10 (and everything else) left completely
# untouched and active, runs that same 4-step chain in reverse and forces a
# direct contradiction:
#   NOT Clue16 (negated) says: exists h: h.position=1 and h.nationality<>
#     #Norwegian -- and since position is a bijection, this collapses to
#     "the (unique) House at position 1 has nationality <> #Norwegian".
#   Clue10 (still active) says: the (unique) Norwegian House has position=1.
# Both cannot hold simultaneously: whichever House sits at position 1 would
# have to be simultaneously the Norwegian House (forced there by Clue10,
# since some House must be Norwegian by the nationality bijection, and
# Clue10 sends it to position 1) and NOT the Norwegian House (forced by
# negated Clue16). No re-arrangement of the other 4 Houses or any other
# clue can route around this -- it is a pairwise clash on the single
# House object occupying position 1, independent of how the rest of the
# puzzle's combinatorics play out. This is a stronger, airtight guarantee
# than merely negating Clue10 by itself: negating Clue10 alone (tried and
# rejected while building this section -- confirmed SATISFIABLE, with the
# Norwegian relocated to house 4 in the alternate solution found) only
# forces "the Norwegian is not at position 1" and leaves the solver free to
# put the Norwegian anywhere else; negating this derived converse instead
# pins the clash to position 1's occupant specifically, which Clue10 can
# never route around since Clue10 unconditionally sends the (unique)
# Norwegian House to position 1.
#
# Confirmed by actually running the solver (see the throwaway .cmd used
# while building this section): SAT4J, bitwidth 4 (same as the default
# section -- position and its +/-1 neighbors only ever need 0..6, well
# within a 4-bit signed range, and this section's population/clue set is
# otherwise identical) -- UNSATISFIABLE.
# ---------------------------------------------------------------------------
[clue10_contradiction]

Integer_min = 0
Integer_max = 6

House_min = 5
House_max = 5

House_PositionRange = active
House_DistinctPosition = active
House_DistinctColor = active
House_DistinctNationality = active
House_DistinctDrink = active
House_DistinctSmoke = active
House_DistinctPet = active

House_Clue02_EnglishmanRedHouse = active
House_Clue03_SpaniardOwnsDog = active
House_Clue04_CoffeeInGreenHouse = active
House_Clue05_UkrainianDrinksTea = active
House_Clue06_GreenRightOfIvory = active
House_Clue07_OldGoldOwnsSnails = active
House_Clue08_KoolsInYellowHouse = active
House_Clue09_MilkInMiddleHouse = active
House_Clue10_NorwegianFirstHouse = active
House_Clue11_ChesterfieldsNextToFox = active
House_Clue12_KoolsNextToHorse = active
House_Clue13_LuckyStrikeDrinksOJ = active
House_Clue14_JapaneseSmokesParliaments = active
House_Clue15_NorwegianNextToBlue = active

# The actual contradiction: Clue10 stays active (forces the Norwegian's
# position to 1); Clue16 -- its own directly-derived converse -- is negated
# (forces position 1's occupant to NOT be Norwegian). See the section header
# comment above for the full 4-step bijection argument for why these two,
# together, are unsatisfiable regardless of the other 19 invariants.
House_Clue16_FirstHouseIsNorwegian_Corollary = negate
