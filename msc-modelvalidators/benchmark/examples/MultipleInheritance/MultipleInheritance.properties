# -----------------------------------------------------------------------
# MultipleInheritance.properties -- Kodkod ModelValidator bounds
#
# Exactly one direct instance of every class (A, B, C, D, E) -- 5 objects
# total, matching the original bundled example's own MultipleInheritance.cmd
# ("creates an object for every class"). None of these classes are
# abstract, so unlike Inheritance's Vehicle_min/max = 0/0, every class
# here gets a direct population of 1.
#
# Same empirically-discovered rule as Inheritance/Vehicle.properties
# applies: an attribute must be bounded under the DECLARING class's name,
# not any subclass's. D < B, C, E inherits levelB (declared on B), levelC
# (declared on C) and tag (declared on E) -- those three domains are
# therefore sized to cover BOTH the declaring class's own direct instance
# AND D's inherited need for a value, i.e. 2 kind-of-B objects (b, d),
# 2 kind-of-C objects (c, d), 2 kind-of-E objects (e, d). A_name similarly
# has to cover every kind-of-A object: a, b, c AND d (4 objects, since D
# reaches A along two different inheritance paths -- B<A and C<A -- but is
# still only a single object).
#
# B_levelB and C_levelC deliberately share the identical domain {1,2,3}
# rather than disjoint ranges, so D::LevelsDiffer (self.levelB <> self.levelC)
# is a real search constraint Kodkod has to satisfy by picking two distinct
# values, not something trivially true no matter what it picks.
# -----------------------------------------------------------------------

Integer_min = 0
Integer_max = 7

A_min = 1
A_max = 1

B_min = 1
B_max = 1

C_min = 1
C_max = 1

D_min = 1
D_max = 1

E_min = 1
E_max = 1

A_name = Set{'root-a','root-b','root-c','root-d'}
B_levelB = Set{1,2,3}
C_levelC = Set{1,2,3}
D_depth = Set{1,2,3}
E_tag = Set{'tag-e','tag-d'}

A_NameNotEmpty = active
D_LevelsDiffer = active
D_DepthMatchesTag = active

# -----------------------------------------------------------------------
# [collision] -- deliberate UNSAT companion to the (unnamed) section above,
# pairing with it the same way AggregationComposition/
# FileSystem_default.properties pairs its own [cycle] section against a
# working default: same model, same five-object population, same three
# active invariants -- ONE bound narrowed just enough to make exactly one
# of those invariants genuinely infeasible.
#
# Sections load via commons-configuration's HierarchicalINIConfiguration
# (same empirically-discovered rule noted in FileSystem_default.properties):
# each [section] is a fully independent sub-configuration, so every key
# this section needs is repeated here rather than inherited from above.
#
# The change: B_levelB (declared on B) and C_levelC (declared on C) --
# D's two attribute-bearing ancestors reached along the diamond's two
# distinct paths back to A (D < B < A and D < C < A) -- are shrunk from the
# SAT section's shared-but-multi-valued Set{1,2,3} down to the exact same
# SINGLETON value, Set{5}, on both sides. {1,2,3} lets Kodkod pick two
# DIFFERENT values out of the shared candidate pool for D::LevelsDiffer
# (d.levelB <> d.levelC); a singleton pool leaves no such choice at all --
# every B-typed object's levelB (including D's, inherited from B) can only
# ever be 5, and every C-typed object's levelC (including D's, inherited
# from C) can only ever be 5, so d.levelB = d.levelC = 5 is now the ONLY
# possible instantiation. That directly and unavoidably contradicts
# D::LevelsDiffer.
#
# This is not an empty-universe or zero-bound case (contrast Inheritance's
# Vehicle_min/max = 0/0 for an abstract class): A, B, C, D, E are all still
# populated exactly 1/1 as in the SAT section above, and the OTHER two
# invariants stay independently satisfiable with their domains untouched --
# A_name is non-empty (A::NameNotEmpty holds), D_depth > 0 and E_tag is
# non-empty (D::DepthMatchesTag holds). Only D::LevelsDiffer is driven into
# genuine infeasibility, by colliding the two ancestor-declared attribute
# domains D depends on into one shared singleton value. Verified
# UNSATISFIABLE by actually running the solver (mv -config bitwidth := 8;
# mv -validate MultipleInheritance.properties collision).
# -----------------------------------------------------------------------

[collision]

Integer_min = 0
Integer_max = 7

A_min = 1
A_max = 1

B_min = 1
B_max = 1

C_min = 1
C_max = 1

D_min = 1
D_max = 1

E_min = 1
E_max = 1

A_name = Set{'root-a','root-b','root-c','root-d'}

# The deliberate contradiction: both singleton AND identical. Compare to
# the SAT section's shared-but-multi-valued Set{1,2,3} for both -- there,
# the shared pool still has two distinct values to choose from; here it
# has exactly one.
B_levelB = Set{5}
C_levelC = Set{5}

D_depth = Set{1,2,3}
E_tag = Set{'tag-e','tag-d'}

A_NameNotEmpty = active
D_LevelsDiffer = active
D_DepthMatchesTag = active
