# -----------------------------------------------------------------------
# FileSystem_default.properties -- Kodkod ModelValidator bounds for
# FileSystem.use, DEFAULT config: aggregationcyclefreeness=on,
# forbiddensharing=on (the plugin's own defaults; set explicitly in every
# section anyway so the contrast with FileSystem_off.properties is visible
# even to a reader who skips the docs).
#
# Two things discovered empirically while building this, not documented
# anywhere upstream:
#
# 1) Sections load via commons-configuration's HierarchicalINIConfiguration,
#    where each [section] is a fully independent sub-configuration -- keys
#    have to be repeated inside EVERY section that needs them (a first
#    attempt with aggregationcyclefreeness/forbiddensharing written once
#    above the first [section] header was silently ignored by every
#    section).
# 2) Every plain (non-derived) association needs EXPLICIT _min/_max bounds
#    (or a concrete Set{} literal, which overrides them) in every section
#    that uses it -- an association left unmentioned does not default to
#    "unconstrained", it defaults to Usage.pdf's documented no-config-file
#    default of "exactly one link", even when a config file IS given for
#    everything else. Leaving FolderHasFile/ArchiveHasMedia unmentioned in
#    an earlier draft of [cycle] (where File_max=Archive_max=0, i.e. no
#    valid link targets exist at all) produced a spurious
#    TRIVIALLY_UNSATISFIABLE from `#(...FolderHasFile...) = 1`, unrelated
#    to the cycle this section is actually trying to test. Every
#    association below is now explicitly bounded in every section.
#
#   [cycle]   forces PrimaryContains={(f1,f2)} and AltContains={(f2,f1)} --
#             a 2-hop cycle closing ACROSS the two different associations
#             (f1 primary-parent-of f2, f2 alt-parent-of f1). Neither
#             association alone contains a cycle, so this is NOT the
#             unconditionally-blocked single-association case (see
#             FileSystem.use's header comment) -- it is exactly the shape
#             whose rejection is actually gated by aggregationcyclefreeness
#             in this plugin build.
#   [sharing] forces the single MediaFile instance (m1, a subclass of File)
#             to be the sole possible target of BOTH FolderHasFile (whose
#             part end is File) and ArchiveHasMedia (whose part end is
#             MediaFile) -- a single object composed by two different
#             wholes at once. Note ArchiveHasMedia is forced with an
#             explicit Set{(a1,m1)} literal (its declared part-end class,
#             MediaFile, matches m1's own class exactly), but FolderHasFile
#             is NOT given an explicit Set{} literal naming m1: the plugin
#             rejects a named literal that mixes a superclass-typed
#             association end with a subclass-declared object name
#             ("Only defined objects of class File can be used" --
#             confirmed by actually trying it). Instead FolderHasFile is
#             just bounded to exactly 1 link and left to the solver, which
#             has no choice but m1 (the only File-typed object that exists
#             at all, since File_min=File_max=0).
#
# Both sections are expected to come back UNSATISFIABLE with this file
# (aggregationcyclefreeness=on / forbiddensharing=on): the reconstructed
# object diagram's forced cycle / forced sharing is detected by USE core's
# own checkStructure() graph walk, the plugin treats that as an error and
# retries excluding this exact solution, and since every value is pinned by
# concrete Set{} literals or exact population counts there is no
# alternative solution left to find. Verified below (see
# validateDefault.cmd) by actually running the solver.
# -----------------------------------------------------------------------

[cycle]

aggregationcyclefreeness = on
forbiddensharing = on

Integer_min = 1
Integer_max = 5

Folder_min = 2
Folder_max = 2
Folder = Set{f1,f2}
Folder_name = Set{'Root','Sub'}

# f1 primary-parent-of f2, f2 alt-parent-of f1: closes a cycle across the
# two different associations.
PrimaryContains = Set{(f1,f2)}
AltContains = Set{(f2,f1)}

File_min = 0
File_max = 0
MediaFile_min = 0
MediaFile_max = 0
Archive_min = 0
Archive_max = 0

# No File/MediaFile/Archive objects exist in this section at all, so both
# of these MUST be explicitly zeroed too (see discovery note 2 above).
FolderHasFile_min = 0
FolderHasFile_max = 0
ArchiveHasMedia_min = 0
ArchiveHasMedia_max = 0

[sharing]

aggregationcyclefreeness = on
forbiddensharing = on

Integer_min = 1
Integer_max = 5

Folder_min = 1
Folder_max = 1
Folder = Set{f1}
Folder_name = Set{'Documents'}

Archive_min = 1
Archive_max = 1
Archive = Set{a1}
Archive_name = Set{'Backup'}

# File attributes must be bounded under File (the DECLARING class), even
# for MediaFile instances -- confirmed pattern from 07-Inheritance/
# Vehicle.properties (Car/Truck attributes declared on the abstract
# superclass Vehicle had to be bounded as Vehicle_*, not Car_*/Truck_*).
File_min = 0
File_max = 0

MediaFile_min = 1
MediaFile_max = 1
MediaFile = Set{m1}
File_name = Set{'clip.mp4'}
File_size = Set{1,2,3}
MediaFile_codec = Set{'h264','vp9'}

# Only 1 Folder exists here, so leave both self-referential Folder
# compositions explicitly empty (an implicit default-1-link would force a
# self-loop f1->f1, which the model's own notOwnPrimaryParent invariant
# already forbids independently of this example's toggles).
PrimaryContains_min = 0
PrimaryContains_max = 0
AltContains_min = 0
AltContains_max = 0

# FolderHasFile: bounded (not named -- see discovery note above), leaving
# the solver no choice but to link f1 to the only File-typed object that
# exists at all, m1.
FolderHasFile_min = 1
FolderHasFile_max = 1

# ArchiveHasMedia: named directly, since m1 IS of the exact declared class
# (MediaFile) here.
ArchiveHasMedia = Set{(a1,m1)}
