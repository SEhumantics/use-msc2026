# -----------------------------------------------------------------------
# Casting.properties -- unc-modelvalidator bounds for Casting.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) specifically to give
# the oclAsType downcast (against a bare context variable) and the guarded-
# downcast idiom a real, wired benchmark scenario -- no shipped invariant
# anywhere exercised the cast before this (the Inheritance corpus model only
# mentions oclAsType in comments and post-solve queries).
#
# [main] is SATISFIABLE: exactly one Car (numDoors from {2,4}) and one Truck
# (payloadCapacity from {3,5}) are forced; every payload candidate is
# positive and every door candidate non-negative, so both guarded downcasts
# hold, and a successful cast tests kindOf its own target.
#
# [unsat] is UNSATISFIABLE: payloadCapacity's domain is narrowed to {0,-1} --
# every candidate NON-positive -- so the forced Truck violates
# TruckPayloadPositiveWhenTruck no matter what else is assigned. The
# population stays exactly as in the SAT case (1 Car, 1 Truck): a genuine
# invariant-level contradiction, not an empty-universe trick.
# -----------------------------------------------------------------------

[main]

Integer_min = 0
Integer_max = 10

Vehicle_min = 0
Vehicle_max = 0

Vehicle_licensePlate = Set{'CAR-001','TRK-100'}

Car_min = 1
Car_max = 1
Car_numDoors = Set{2,4}

Truck_min = 1
Truck_max = 1
Truck_payloadCapacity = Set{3,5}

Vehicle_TruckPayloadPositiveWhenTruck = active
Vehicle_CarDoorsNonNegWhenCar = active
Vehicle_CastIsKindOfTarget = active

[unsat]

Integer_min = -1
Integer_max = 10

Vehicle_min = 0
Vehicle_max = 0

Vehicle_licensePlate = Set{'CAR-001','TRK-100'}

Car_min = 1
Car_max = 1
Car_numDoors = Set{2,4}

Truck_min = 1
Truck_max = 1
Truck_payloadCapacity = Set{0,-1}

Vehicle_TruckPayloadPositiveWhenTruck = active
Vehicle_CarDoorsNonNegWhenCar = active
Vehicle_CastIsKindOfTarget = active
