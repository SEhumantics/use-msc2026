# -----------------------------------------------------------------------
# CollectionSemantics.properties -- bounds for CollectionSemantics.use
#
# Exactly 1 Playlist, exactly 3 Songs, exactly 3 Contains links (all
# already forced structurally by the [1]/[3] association-end
# multiplicities in the .use file -- restated here for clarity, matching
# this repo's convention of setting explicit association bounds even
# when multiplicities already constrain them, see 01-Library).
#
# Song_album is restricted to only 2 possible values on purpose: with 3
# Songs and only 2 possible album values, the pigeonhole principle
# guarantees at least two Songs share an album value in every solution.

Playlist_min = 1
Playlist_max = 1

Song_min = 3
Song_max = 3
Song_album = Set{1,2}

Contains_min = 3
Contains_max = 3

Playlist_hasThreeSongs = active

# -----------------------------------------------------------------------
# [shortage] -- genuine STRUCTURAL infeasibility, independent of the
# Bag/Set collapse limitation this file's default (unnamed) section
# exists to demonstrate (see the .use file's header comment and
# NOTES.md).
#
# The .use file's association declares:
#
#   association Contains between
#     Playlist [1] role playlist
#     Song     [3] role songs
#   end
#
# i.e. every Playlist instance MUST be linked to EXACTLY 3 Songs -- a
# hard structural multiplicity of the model itself, additionally
# restated (not merely implied) by the Playlist_hasThreeSongs invariant
# (self.songs->size() = 3, active below, same as in the default
# section). This has nothing to do with the pigeonhole/Song_album trick
# the default section uses -- it is a plain population-vs-link-count
# contradiction.
#
# This section keeps the population fully normal -- exactly 1 Playlist
# and exactly 3 Songs, same object counts as the working default
# section -- but caps the TOTAL number of Contains links allowed in any
# solution at 2, strictly below the 3 links the lone Playlist is
# structurally required to have (via the [3] multiplicity) and that the
# hasThreeSongs invariant additionally demands. No solution can satisfy
# "1 Playlist, each needing exactly 3 songs-links" and "at most 2
# Contains links total" simultaneously: every other bound is exactly as
# populated as the SAT case, only the Contains link ceiling is starved
# below what the multiplicity/invariant requires -- not a vacuous
# empty-universe or zero-class-bound case.
#
# Verified UNSATISFIABLE by actually running the solver: see
# /tmp/.../collectionsemantics_shortage_check.cmd, run via
#   java -jar use-gui.jar -nogui CollectionSemantics.use <that .cmd>
# from this directory.
# -----------------------------------------------------------------------

[shortage]

Playlist_min = 1
Playlist_max = 1

Song_min = 3
Song_max = 3
Song_album = Set{1,2}

# The structural shortfall: the songs role's [3] multiplicity (plus the
# hasThreeSongs invariant) requires exactly 3 Contains links for the one
# Playlist that exists here -- but this caps the link count's ceiling
# BELOW that requirement, forcing a genuine structural contradiction.
Contains_min = 2
Contains_max = 2

Playlist_hasThreeSongs = active
