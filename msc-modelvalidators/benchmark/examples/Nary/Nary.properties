# -----------------------------------------------------------------------
# Nary.properties -- unc-modelvalidator bounds for Nary.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) to give the n-ary
# association slice (arity >= 3) its first wired corpus coverage. Kodkod's own
# n-ary support was source-evidenced but never exercised by any shipped
# example on either tool; NaryAssociationProbeTest pins the kk side
# empirically, this scenario pins the unc side through the real pipeline.
#
# [main] is SATISFIABLE: exactly one ternary link (sup, p1, j1) is FORCED via
# the explicit 3-tuple bound -- the n-ary generalization of the binary
# Set{(a,b)} link literal -- and both projected navigations (from Supplier and
# from Project onto Part) are non-empty exactly because that tuple exists.
#
# [unsat] is UNSATISFIABLE: the association's link-count bound is 0..0 and no
# tuple is forced, so no link can exist -- both notEmpty projections are
# genuinely violated over a fully populated model (1 Supplier, 1 Part,
# 1 Project, every degree constraint satisfied at zero).
# -----------------------------------------------------------------------

[main]

Integer_min = 1
Integer_max = 5

Supplier_min = 1
Supplier_max = 1
Supplier = Set{sup}
Supplier_name = Set{'ACME'}

Part_min = 1
Part_max = 1
Part = Set{p1}
Part_sku = Set{'p1'}

Project_min = 1
Project_max = 1
Project = Set{j1}
Project_title = Set{'apollo'}

Supplies_min = 1
Supplies_max = 1
Supplies = Set{(sup,p1,j1)}

Supplier_navigatedPartPresent = active
Project_navigatedPartPresentFromProject = active

[unsat]

Integer_min = 1
Integer_max = 5

Supplier_min = 1
Supplier_max = 1
Supplier = Set{sup}
Supplier_name = Set{'ACME'}

Part_min = 1
Part_max = 1
Part = Set{p1}
Part_sku = Set{'p1'}

Project_min = 1
Project_max = 1
Project = Set{j1}
Project_title = Set{'apollo'}

Supplies_min = 0
Supplies_max = 0

Supplier_navigatedPartPresent = active
Project_navigatedPartPresentFromProject = active
