# The second U-type family: an uncertain INTEGER count. The comparison constants come
# from a monotone search through USE's own UInteger.gt path -- which is literally
# toUReal().gt(...), so the boundary is the SAME normal-CDF threshold the UReal rows use,
# not a second approximation. What differs is that the representative can only take
# INTEGER values, so the solver's own integer theory decides the verdict at the boundary.
#
# USE's real-valued transition for sigma = 1.0, literal 5, confidence 0.95:
#     mu = 6.6448534751573820
# so the least admissible INTEGER representative is 7. Observed probabilities:
#     n = 6   P(n > 5) = 0.8413447404370406   below 0.95
#     n = 7   P(n > 5) = 0.9772499379857728   at or above 0.95
#     n = 8   P(n > 5) = 0.9986500327777663

# Nominal erasure sees 6 > 5 and accepts. The real uncertain probability is only about
# 0.84134, so the required 0.95 confidence correctly rejects it.
[below]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{6}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active

[at]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{7}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active

[above]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{8}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active

# Both integers straddling the real-valued transition are offered at once. Only 7
# survives, and nothing but the Int sort rules 6 out: the linear boundary the encoding
# emits is satisfied by every real from 6.6448534751573820 upward.
[rounding]
Batch_min = 1
Batch_max = 1
Batch_units_value = Set{6,7}
Batch_units_uncertainty = Set{1.0}
Batch_ReliableCount = active
