# -----------------------------------------------------------------------
# Vehicle.properties -- Kodkod ModelValidator bounds for Vehicle.use
#
# A small, deliberately over-constrained search space: exactly 1 Car and
# 1 Truck (2 Vehicle instances total via inheritance -- Vehicle itself is
# abstract and has no direct instances of its own, so Vehicle_min/max are
# pinned to 0/0), each with a tiny enumerated attribute domain. Meant to
# solve in well under a second while still forcing both concrete
# subclasses to appear in the same solution, so the polymorphic
# Vehicle.allInstances() query in query.cmd has something genuinely mixed
# to demonstrate.
#
# Discovered empirically, not documented anywhere upstream: an attribute
# declared on a SUPERCLASS (here, Vehicle::licensePlate and
# Vehicle::wheels) must be bounded under the DECLARING class's name
# (`Vehicle_licensePlate`, `Vehicle_wheels`) even when every actual
# instance is a Car or a Truck -- `Car_wheels`/`Truck_wheels` are silently
# ignored (no error). The consequence is subtler and more insidious than a
# clean failure, not a "TRIVIALLY_UNSATISFIABLE" as an earlier version of
# this comment wrongly claimed: confirmed by actually reproducing it,
# substituting Car_wheels/Truck_wheels for Vehicle_wheels here still comes
# back SATISFIABLE, because a wrongly-scoped Integer attribute silently
# falls back to the type-wide Integer_min/Integer_max range above (0..7)
# instead of the intended {4,6,8} enumerated domain -- wheels just gets
# quietly under-tested, with no error or warning at all. A String
# attribute (Vehicle_licensePlate) has no such type-wide fallback
# configured here, so wrongly scoping IT does genuinely fail -- but with a
# plain UNSATISFIABLE, not a "TRIVIALLY_" one, and no "Undefined in (...)"
# message: that quoted proof text does not correspond to anything this
# plugin build actually emits (confirmed by grepping the whole source
# tree). Confirmed by directly comparing both variants against this
# plugin build.
# -----------------------------------------------------------------------

Integer_min = 0
Integer_max = 7

Vehicle_min = 0
Vehicle_max = 0

Vehicle_licensePlate = Set{'CAR-001','TRK-100'}
Vehicle_wheels = Set{4,6,8}

Car_min = 1
Car_max = 1

Car_numDoors = Set{2,4,5}

Truck_min = 1
Truck_max = 1

Truck_payloadCapacity = Set{2,5,10}

Vehicle_PositiveWheels = active
Car_ReasonableDoors = active
Truck_PositivePayload = active

# -----------------------------------------------------------------------
# [nonpositivewheels] -- deliberately UNSATISFIABLE companion to the
# default (unnamed) section above: same model, same required population
# of exactly 1 Car and 1 Truck, paired SAT/UNSAT benchmark scenario (same
# pattern as AggregationComposition/FileSystem_default.properties's own
# [cycle]/[sharing] sections).
#
# The only change from the default section above is Vehicle_wheels: the
# default section offers Set{4,6,8} (all positive, so PositiveWheels
# trivially holds); this section instead narrows the candidate domain to
# Set{0,-2,-4} -- every candidate value is NON-POSITIVE. Car_min/max and
# Truck_min/max are left UNCHANGED at 1/1 each, so at least one Car and
# one Truck instance are still structurally forced to exist (this is not
# an empty-universe or zero-bound trick -- the universe is populated
# exactly as in the SAT case). Since `wheels` is declared on the abstract
# superclass Vehicle and inherited by both Car and Truck, and its entire
# candidate domain is now <= 0, the superclass invariant
# `context v:Vehicle inv PositiveWheels: v.wheels > 0` (Vehicle.use line
# 30) can never be satisfied by the Car/Truck instances the population
# bounds force into existence -- a genuine invariant-level contradiction
# localized to exactly PositiveWheels. ReasonableDoors and PositivePayload
# remain ordinarily satisfiable (Car_numDoors/Truck_payloadCapacity
# candidates are unchanged from the default section), so the rest of the
# model populates and validates normally; only PositiveWheels is
# structurally unenforceable. Integer_min is widened to -4 (from the
# default section's 0) purely so the negative wheels candidates fall
# inside the modeled Integer range; Integer_max is left at 7, still large
# enough for numDoors/payloadCapacity. Confirmed UNSATISFIABLE by actually
# running the solver against this exact section.
# -----------------------------------------------------------------------

[nonpositivewheels]

Integer_min = -4
Integer_max = 7

Vehicle_min = 0
Vehicle_max = 0

Vehicle_licensePlate = Set{'CAR-001','TRK-100'}

# Every candidate value here is <= 0, directly contradicting
# PositiveWheels (v.wheels > 0) for whichever Car/Truck instance the
# population bounds below force into existence.
Vehicle_wheels = Set{0,-2,-4}

Car_min = 1
Car_max = 1

Car_numDoors = Set{2,4,5}

Truck_min = 1
Truck_max = 1

Truck_payloadCapacity = Set{2,5,10}

Vehicle_PositiveWheels = active
Car_ReasonableDoors = active
Truck_PositivePayload = active
