# -----------------------------------------------------------------------
# URealPairwise.properties -- unc-modelvalidator bounds for URealPairwise.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) to give the general
# uncertain-vs-uncertain ordered comparison (UReal vs UReal over
# multi-candidate domains) its wired benchmark coverage.
#
# [main] is SATISFIABLE through exactly ONE candidate pair: speedA's
# uncertainty candidates {0.0, 0.05} straddle theta = 0.999. u_A = 0.05 gives
# P(A < B) ~ 0.9973 (the equal-sigma crossing model, means 0.30/0.60) --
# below theta; u_A = 0.0 takes USE's degenerate branch, P = 1 - CNDF(-6) ~
# 1.0 -- above it. The witness must therefore select u_A = 0.0.
#
# [unsat] is UNSATISFIABLE: A's uncertainty domain narrows to {0.05} only, so
# the single remaining pair's probability ~ 0.9973 sits BELOW the 0.999
# confidence and nothing can satisfy the invariant.
# -----------------------------------------------------------------------

[main]

Sensor_min = 1
Sensor_max = 1

Sensor_speedA_value = Set{0.30}
Sensor_speedA_uncertainty = Set{0.0, 0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}

Sensor_aBelowBTight = active

[unsat]

Sensor_min = 1
Sensor_max = 1

Sensor_speedA_value = Set{0.30}
Sensor_speedA_uncertainty = Set{0.05}
Sensor_speedB_value = Set{0.60}
Sensor_speedB_uncertainty = Set{0.05}

Sensor_aBelowBTight = active
