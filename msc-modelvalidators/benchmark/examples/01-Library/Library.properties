# -----------------------------------------------------------------------
# [titleCollision] -- paired UNSAT counterpart to the section above.
#
# Same population sizes as the base (unnamed) SAT section: 3 Users, 3
# Copies, 3 Books, all the same invariants active. The ONE deliberate
# change is Book_title: shrunk from 3 distinct candidate strings down to
# 2, while Book_min/Book_max stay pinned at exactly 3.
#
# Why this is a genuine structural contradiction, not an empty-universe
# trick: Book_titleIsKey (Library.use, context b1:Book) requires every
# pair of distinct Book instances to have distinct titles. With
# Book_min=Book_max=3 forcing exactly 3 Book objects to exist, and only 2
# candidate title values offered for the solver to assign from, pigeonhole
# guarantees at least two of those 3 Book objects are assigned the same
# title string no matter which 2 values are chosen or which objects get
# them -- there is no assignment of {book1,book2,book3} -> {title-a,
# title-b} that keeps all three titles pairwise distinct. Book_titleFormatOk
# stays trivially satisfiable throughout (both candidate titles are
# non-empty), so this section isolates exactly one broken invariant
# (Book_titleIsKey) while Users, Copies, both associations, and every
# other Book invariant (authSeqFormatOk, yearPlausible) remain populated
# and satisfiable exactly as in the base section.
#
# Every key this section needs is repeated here in full (not inherited
# from the unnamed section above) -- confirmed convention from
# 08-AggregationComposition/FileSystem_default.properties: commons-config's
# HierarchicalINIConfiguration treats each [section] as a fully
# independent sub-configuration, so values set before the first [section]
# header are NOT visible to a named section requested via
# `mv -validate Library.properties titleCollision`.
#
# Expected UNSATISFIABLE with this file (bitwidth 12, same as the base
# section -- no reason to raise it, the integer domain (Book_year,
# Copy_numReturns) is unchanged and the contradiction here is purely
# about the String title domain, not about integer range). Verified by
# actually running the solver (see the throwaway .cmd used during
# authoring; UNSATISFIABLE was the real printed result, not assumed).
# -----------------------------------------------------------------------

[titleCollision]

User_min = 3
User_max = 3
User_name = Set{'Ada','Bob','Cyd'}
User_address = Set{'NY','CA','FL'}

Copy_min = 3
Copy_max = 3
Copy_signature = Set{'DBS42','DBS43','NW21'}
Copy_numReturns = Set{0,2,4}

Book_min = 3
Book_max = 3
# Only 2 distinct titles offered for 3 required Book objects -- see the
# section header comment above for why this alone forces UNSATISFIABLE
# via Book_titleIsKey (pigeonhole), independent of every other bound here.
Book_title = Set{'DBforDummies','IntrotoAI'}
Book_auth = Set{'Ada','Bob','Cyd'}
Book_year = Set{2000,2005,2010}

Borrows_min = 1
Borrows_max = -1

BelongsTo_min = 1
BelongsTo_max = -1

User_nameAddressFormatOk = active
User_nameIsKey = active
User_noDoubleBorrowings = active
Copy_signatureFormatOk = active
Copy_signatureIsKey = active
Book_titleFormatOk = active
Book_titleIsKey = active
Book_authSeqFormatOk = active
-- Book_authSeqExistsAndUnique = active
Book_yearPlausible = active
