# ---------------------------------------------------------------------------
# CompanyEmployment.properties -- Kodkod ModelValidator bounds for
# CompanyEmployment.use
#
# Bounds for the association class (Employment) work exactly like an
# ordinary class -- Employment_min/_max below sets BOTH the number of
# Employment objects (read by the class configurator, key "Employment_min"/
# "Employment_max") AND the number of links of the underlying association
# (read by the association configurator, key "Employment_min"/"Employment_max"
# again) -- confirmed by reading PropertyConfigurationVisitor.setClassConfigurator
# / setAssociationConfigurator: both read "<name>_min"/"<name>_max" off the
# class/association name, and an association class's association shares the
# class's own name (see ModelTransformator.transformAssociationClasses,
# which passes mAssociationClass.name() to both factory.createAssociationClass
# and transformAssociation). Since an Employment instance IS simultaneously
# the object and the link, this coincidence is exactly correct -- there is
# only one count to bound, not two.
#
# [small] keeps the population tiny (2 Person, 2 Company, 1..2 Employment)
# so the solver only has to decide which of at most 4 possible
# (Person,Company) pairs actually gets an Employment link, subject to the
# Company[0..1]-per-Person cap -- small enough to solve in well under a
# second (confirmed below).
# ---------------------------------------------------------------------------

[small]

Integer_min = 0
Integer_max = 15

# ----------------------------------------------------------------- Person
Person_min = 2
Person_max = 2

Person_name = Set{'Ada','Bob'}

# ---------------------------------------------------------------- Company
Company_min = 2
Company_max = 2

Company_name = Set{'Acme','Globex'}
Company_budget = Set{6,9,12}

# -------------------------------------------------------------- Employment
# 1..2, not 0..2: this scenario's own stated question is "can Kodkod
# reconstruct a link object that is simultaneously a class instance and an
# association link" -- with min=0, a legal SAT witness could contain zero
# Employment objects and answer nothing. Confirmed live, not theoretical:
# the Lingeling backend deterministically picked the empty-Employment
# corner every run at min=0, while every SAT4J-family solver picked
# Employment=2 -- different solvers genuinely land on different corners of
# an underconstrained space, so "the default solver happens to produce a
# link object" was never a guarantee. min=1 forces every witness to
# reconstruct at least one Employment link object, which is what the
# scenario is actually meant to demonstrate; max stays 2 so the solver
# still has a real (not forced-unique) choice to make.
Employment_min = 1
Employment_max = 2

Employment_salary = Set{2,4,6,8}
Employment_startDate = Set{0,1,2,3}
# -------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# [linkcap] -- deliberately UNSATISFIABLE pairing for the [small] section
# above (same model, same bound *shape*, one bound pushed past what the
# Company[0..1]-per-Person multiplicity structurally allows).
#
# The association end read as "Company [0..1] role employer" (see
# CompanyEmployment.use lines 21-27) means: for each Person, the number of
# Company objects reachable via role `employer` is 0..1 -- i.e. across ALL
# Employment links in the whole instance, a given Person can be the
# `employee` end of AT MOST ONE Employment object. Since an association
# class instance IS the link (see the header comment above on
# Employment_min/_max sharing one key for both the class and the
# association configurators), this multiplicity alone caps the total
# number of Employment objects that can ever coexist at Person_max --
# completely independent of how many Company objects exist, since a
# single Company can employ any number of Persons (the [0..*] employee
# end is unbounded).
#
# Person_min = Person_max = 3, so the structurally-possible maximum number
# of Employment objects in ANY valid instance is exactly 3 (one per
# Person, at most). Employment_min = 4 asks the solver for a 4th
# Employment object -- which would require some Person to be the
# `employee` of two links at once, directly violating the Company[0..1]
# end multiplicity that CompanyEmployment.use itself declares (not a
# separate OCL invariant -- USE's own structural/multiplicity check,
# enforced the same way [cycle] in AggregationComposition/
# FileSystem_default.properties relies on USE core's checkStructure()).
#
# Every other bound here is left exactly as populated as [small]: Person,
# Company, and the attribute value pools are all non-empty and would
# happily support a *3*-Employment instance (PositiveSalary,
# SalaryBelowEmployerBudget, etc. are all easily satisfiable with these
# domains) -- only the single push of Employment_min from 1 (in [small])
# to 4 (one more than the Person-capped ceiling of 3) is the deliberate
# contradiction, so this isolates the Company[0..1] multiplicity cap as
# the one thing that fails, not an empty-universe or zeroed-class trick.
# Verified UNSATISFIABLE by an actual solver run (see the task's
# throwaway /tmp .cmd) before this section was left in place.
#
# Bitwidth: reusing 12 (same as [small]) -- every value here (Person=3,
# Company=2, Employment=4, budgets up to 12, salaries up to 8) sits
# comfortably inside a 12-bit signed range, so there is no reason to widen
# it just for this section.
# ---------------------------------------------------------------------------

[linkcap]

Integer_min = 0
Integer_max = 15

# ----------------------------------------------------------------- Person
Person_min = 3
Person_max = 3

Person_name = Set{'Ada','Bob','Cleo'}

# ---------------------------------------------------------------- Company
Company_min = 2
Company_max = 2

Company_name = Set{'Acme','Globex'}
Company_budget = Set{6,9,12}

# -------------------------------------------------------------- Employment
# One MORE than the Person-capped structural ceiling (3) -- see comment
# block above. Every Person can supply at most one Employment link (the
# Company[0..1] end multiplicity), so a 4th Employment object has no
# possible `employee` left to bind it to.
Employment_min = 4
Employment_max = 4

Employment_salary = Set{2,4,6,8}
Employment_startDate = Set{0,1,2,3}
# -------------------------------------------------------------------------
