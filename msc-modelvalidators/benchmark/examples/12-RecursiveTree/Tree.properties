# -----------------------------------------------------------------------
# Tree.properties -- Kodkod ModelValidator bounds for Tree.use.
#
# [tree] (listed first -> this is what `mv -validate Tree.properties`
#   resolves to with no section name given, same convention as
#   03-CompanyERSchema/05-Genealogy). TreeNode pinned to exactly 7 objects,
#   Parentship pinned to exactly 6 links. With `parent` capped at 0..1 per
#   node (Tree.use's own multiplicity), n objects and exactly n-1 parent
#   links forces exactly one parentless node -- i.e. this is not a
#   "single root" invariant, it falls straight out of the bound arithmetic.
#   AcyclicParentshipClosure is the invariant actually enforced during the
#   search. AcyclicParentshipRecursive is listed `inactive` (it plays no
#   part in the search either way -- see the header note in Tree.use and
#   the transform-log ERROR line below: this plugin attempts to transform
#   EVERY declared invariant the first time a `.use` model is transformed
#   in a session, regardless of that invariant's active/inactive setting,
#   and simply drops whichever ones fail to transform from the search
#   formula; active/inactive only controls whether a
#   SUCCESSFULLY-transformed invariant's formula is asserted).
#   Confirmed: SATISFIABLE, 7 objects, 6 links, solver time ~20-30ms
#   (DefaultSAT4J, bitwidth 8).
#
# [forcedCycle] -- 3 TreeNodes pinned by name (x,y,z), Parentship pinned
#   by an explicit Set{} literal to the 3-cycle (x,y),(y,z),(z,x).
#   AcyclicParentshipClosure is still active. Since every object and every
#   link is already pinned by a literal, there are zero free Kodkod
#   variables left once the cycle is asserted -- confirmed outcome is
#   TRIVIALLY_UNSATISFIABLE (not a search-exhausted UNSATISFIABLE), same
#   vocabulary as 08-AggregationComposition's own forced-cycle section.
#   This is the actual "acyclicity genuinely holds" check: the corrected
#   invariant really does reject a cyclic instance, not just vacuously
#   pass an acyclic one.
#
# [recursiveOpProbe] -- minimal 1-object/0-link population, included only
#   to give the transform-time recursion rejection (see Tree.use header,
#   Finding 1) an isolated repro uncluttered by any other structure. The
#   same ERROR line ("Cannot transform invariant
#   `TreeNode::AcyclicParentshipRecursive'. Operation `childPlusOnNodeSet'
#   is recursive and thereby cannot be transformed.") is confirmed to
#   fire for [tree], [forcedCycle] and [recursiveOpProbe] alike -- but
#   only the FIRST time this .use model is transformed in a given USE
#   session (the plugin caches the transformation and reuses it for
#   later -validate calls against other sections in the same session;
#   confirmed by running all three sections together in one session,
#   where the ERROR line appears exactly once, versus three separate
#   fresh sessions, where it appears every time).
#
# [noRoot] -- UNSAT PAIRING for [tree]. Same 7 TreeNodes, same active
#   AcyclicParentshipClosure invariant, only Parentship's bound changed:
#   7 links instead of 6 (n, not n-1). Design note, since the obvious
#   first idea here does NOT work: naively trying to force "2+ roots"
#   by LOWERING the link bound (e.g. 5 links -> 2 parentless nodes) was
#   tried first and confirmed SATISFIABLE -- a forest of two separate
#   acyclic trees is a completely ordinary, valid Tree.use instance;
#   nothing in the model requires single-component connectivity, so
#   "more than one root" is not actually a contradiction of anything.
#   The genuine contradiction runs the OTHER direction: RAISING the link
#   bound to 7 forces ZERO roots instead. `parent` is capped 0..1 per
#   node (Tree.use's own multiplicity), so each of the 7 objects can be
#   the `child` side of at most one link; with exactly 7 links and only
#   7 objects to draw children from, every single object must appear as
#   a child exactly once -- i.e. child->parent becomes a TOTAL function
#   from the 7-object universe onto itself, with no parentless node left
#   over anywhere. A finite, everywhere-defined function from a set to
#   itself always cycles when iterated (pigeonhole: following .parent
#   repeatedly from any start must revisit some node within 8 steps), so
#   AcyclicParentshipClosure (self.child->closure(child)->excludes(self))
#   cannot hold for every node at once once all 7 are forced to have a
#   parent -- exactly one bound (Parentship's link count) is pushed past
#   the threshold the invariant can tolerate; TreeNode population,
#   naming, and every other bound are otherwise identical to [tree].
#   Unlike [forcedCycle] (a SPECIFIC 3-cycle pinned by explicit Set{}
#   link literals, zero free variables, TRIVIALLY_UNSATISFIABLE), this
#   section pins only the link COUNT and leaves which 7 links to the
#   solver entirely -- so this is a genuinely search-explored
#   UNSATISFIABLE, confirmed below (see noRoot.cmd-style verification):
#   outcome UNSATISFIABLE, DefaultSAT4J, bitwidth 8, ~30ms solving time
#   (not the "trivial, zero free variables" flavor forcedCycle produces).
# -----------------------------------------------------------------------

[tree]

Integer_min = 0
Integer_max = 1

TreeNode_min = 7
TreeNode_max = 7
TreeNode_name = Set{'Root','A','B','C','D','E','F'}

Parentship_min = 6
Parentship_max = 6

TreeNode_AcyclicParentshipRecursive = inactive
TreeNode_AcyclicParentshipClosure = active

[forcedCycle]

Integer_min = 0
Integer_max = 1

TreeNode_min = 3
TreeNode_max = 3
TreeNode_name = Set{'X','Y','Z'}
TreeNode = Set{x,y,z}

# A pure 3-cycle: x->y->z->x. Neither a single self-loop nor two
# independent associations are involved here (cf. 08-AggregationComposition's
# distinction) -- this is one association, three distinct objects, closing
# a cycle purely through the AcyclicParentshipClosure invariant's own
# closure() check, which is exactly what this section is testing.
Parentship = Set{(x,y),(y,z),(z,x)}

TreeNode_AcyclicParentshipRecursive = inactive
TreeNode_AcyclicParentshipClosure = active

[recursiveOpProbe]

Integer_min = 0
Integer_max = 1

TreeNode_min = 1
TreeNode_max = 1
TreeNode_name = Set{'Solo'}

Parentship_min = 0
Parentship_max = 0

TreeNode_AcyclicParentshipRecursive = active
TreeNode_AcyclicParentshipClosure = inactive

[noRoot]

Integer_min = 0
Integer_max = 1

TreeNode_min = 7
TreeNode_max = 7
TreeNode_name = Set{'N1','N2','N3','N4','N5','N6','N7'}

# The one bound genuinely pushed past what AcyclicParentshipClosure can
# tolerate: 7 links among 7 nodes (not 6). See the header comment above
# for the full pigeonhole argument -- with `parent` capped 0..1 per node,
# 7 links forces every object to be a child exactly once (zero roots),
# and a total child->parent function on a finite set always cycles when
# iterated, which the active closure-based invariant then rejects.
Parentship_min = 7
Parentship_max = 7

TreeNode_AcyclicParentshipRecursive = inactive
TreeNode_AcyclicParentshipClosure = active
