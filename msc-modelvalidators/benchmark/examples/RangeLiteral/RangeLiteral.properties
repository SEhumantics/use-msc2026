# -----------------------------------------------------------------------
# RangeLiteral.properties -- unc-modelvalidator bounds for RangeLiteral.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) specifically to give
# the constant-bounds Integer range literal (Set{a..b}) and its consumers
# (->includes, ->size(), ->one) a real, wired benchmark scenario -- the
# construct had zero real coverage on either tool before this (Kodkod's sole
# citing scenario never completes transformation for an unrelated reason).
#
# [main] is SATISFIABLE: level's domain {3} sits inside the band 1..5
# (includes holds), the band's size is the literal constant 5, and calib's
# domain {4} is exactly 2x the band element 2, so exactly one element of
# {1..5} doubles to it.
#
# [unsat] is UNSATISFIABLE: level's domain is {7}, which is OUTSIDE the band
# 1..5, so levelWithinSafeBand is violated no matter what else the solver
# assigns -- a genuine, non-vacuous contradiction (the Sensor stays fully
# populated with real attribute values; nothing is forced empty).
# -----------------------------------------------------------------------

[main]

Integer_min = 1
Integer_max = 10

Sensor_min = 1
Sensor_max = 1
Sensor_level = Set{3}
Sensor_calib = Set{4}

Sensor_levelWithinSafeBand = active
Sensor_bandSizeIsFive = active
Sensor_calibrationValueIsSingletonInBand = active

[unsat]

Integer_min = 1
Integer_max = 10

Sensor_min = 1
Sensor_max = 1
Sensor_level = Set{7}
Sensor_calib = Set{4}

Sensor_levelWithinSafeBand = active
Sensor_bandSizeIsFive = active
Sensor_calibrationValueIsSingletonInBand = active
