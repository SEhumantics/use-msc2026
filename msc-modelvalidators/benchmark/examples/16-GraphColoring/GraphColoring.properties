# -----------------------------------------------------------------------
# GraphColoring.properties -- Kodkod ModelValidator bounds for
# GraphColoring.use. Authored from scratch for this thesis project
# (msc-4, Trong-Nghia Be); no upstream properties file to adapt from.
#
# The graph (40 Regions, 67 edges, avg degree 3.35) is fixed exactly via
# the `Adjacent = Set{...}` literal below -- both (a,b) and (b,a) per
# edge, since Region.neighbor navigates one direction per tuple (see
# GraphColoring.use's header comment for the "flat graph" construction
# method and why this specific graph is a genuinely hard, but provably
# 3-colorable, instance). Region names/colors are likewise pinned to
# concrete literal sets rather than left to a generic String/Integer
# domain, exactly as 03-CompanyERSchema/08-AggregationComposition already
# establish as this suite's convention for "the search is over the
# coloring, not over which objects/strings happen to exist".
#
# BITWIDTH DISCOVERY (a real plugin limitation, confirmed by actually
# running every row below against this exact, unchanged graph/k=3
# instance -- not asserted from a single run):
#
#   bitwidth | outcome        | solving time
#   ---------+----------------+-------------
#     4      | UNSATISFIABLE  | ~14 ms   <- WRONG (see below)
#     5      | UNSATISFIABLE  | ~20 ms   <- WRONG (see below)
#     6      | UNSATISFIABLE  | ~13 ms   <- WRONG (see below)
#     8      | SATISFIABLE    | ~13-19 s <- correct, genuinely searched
#
# The bitwidth-4/5/6 UNSATISFIABLE results MUST be false negatives: the
# graph's construction (see GraphColoring.use) is a constructive proof
# that a 3-coloring exists completely independently of the solver's
# integer bitwidth, and `color` only ever needs to represent 1, 2, or 3
# -- comfortably inside even a 3-bit signed range. Something in this
# plugin build's Kodkod encoding evidently needs bitwidth >= 8 headroom to
# correctly search this size of instance (40 objects / 67-edge relation)
# even though the *declared* Integer domain here is tiny; root cause not
# pinned down further than this (no plugin source change was made or
# attempted -- this is a black-box, from-the-outside empirical finding).
# `bitwidth := 8` is therefore used in validate.cmd/query.cmd, and is also
# what actually gives the "several seconds, not milliseconds" solving time
# this example exists to demonstrate.
#
# Tightness of k=3 was independently confirmed too: re-running the
# identical graph with only 2 colors available (Integer_max=2, not shipped
# as a separate file here, but reproduced by editing this file's
# Integer_max in place and re-running) came back UNSATISFIABLE in 77ms --
# i.e. this graph is not just "eventually satisfiable", 3 is genuinely its
# minimum chromatic count.
# -----------------------------------------------------------------------

[main]

Integer_min = 1
Integer_max = 3

Region_min = 40
Region_max = 40
Region = Set{r0,r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,r11,r12,r13,r14,r15,r16,r17,r18,r19,r20,r21,r22,r23,r24,r25,r26,r27,r28,r29,r30,r31,r32,r33,r34,r35,r36,r37,r38,r39}
Region_name = Set{'R0','R1','R2','R3','R4','R5','R6','R7','R8','R9','R10','R11','R12','R13','R14','R15','R16','R17','R18','R19','R20','R21','R22','R23','R24','R25','R26','R27','R28','R29','R30','R31','R32','R33','R34','R35','R36','R37','R38','R39'}

# 67 edges, both directions per edge (134 tuples) -- see GraphColoring.use
# for exactly how this graph was generated and why it's hard-but-3-colorable.
Adjacent = Set{(r0,r4),(r4,r0),(r0,r7),(r7,r0),(r0,r28),(r28,r0),(r0,r36),(r36,r0),(r1,r6),(r6,r1),(r1,r18),(r18,r1),(r1,r19),(r19,r1),(r1,r25),(r25,r1),(r2,r32),(r32,r2),(r2,r37),(r37,r2),(r3,r39),(r39,r3),(r4,r8),(r8,r4),(r4,r16),(r16,r4),(r4,r25),(r25,r4),(r5,r18),(r18,r5),(r6,r29),(r29,r6),(r6,r30),(r30,r6),(r7,r8),(r8,r7),(r7,r16),(r16,r7),(r7,r25),(r25,r7),(r7,r32),(r32,r7),(r7,r37),(r37,r7),(r8,r22),(r22,r8),(r8,r27),(r27,r8),(r8,r35),(r35,r8),(r9,r15),(r15,r9),(r10,r13),(r13,r10),(r10,r22),(r22,r10),(r10,r24),(r24,r10),(r10,r25),(r25,r10),(r10,r27),(r27,r10),(r10,r30),(r30,r10),(r12,r23),(r23,r12),(r13,r15),(r15,r13),(r13,r28),(r28,r13),(r13,r34),(r34,r13),(r14,r35),(r35,r14),(r14,r36),(r36,r14),(r15,r21),(r21,r15),(r15,r26),(r26,r15),(r16,r28),(r28,r16),(r16,r30),(r30,r16),(r18,r21),(r21,r18),(r18,r25),(r25,r18),(r18,r35),(r35,r18),(r19,r20),(r20,r19),(r19,r25),(r25,r19),(r19,r32),(r32,r19),(r20,r22),(r22,r20),(r20,r33),(r33,r20),(r22,r31),(r31,r22),(r23,r24),(r24,r23),(r23,r25),(r25,r23),(r23,r33),(r33,r23),(r23,r34),(r34,r23),(r24,r26),(r26,r24),(r24,r31),(r31,r24),(r25,r36),(r36,r25),(r26,r27),(r27,r26),(r27,r31),(r31,r27),(r28,r35),(r35,r28),(r29,r30),(r30,r29),(r30,r31),(r31,r30),(r30,r33),(r33,r30),(r31,r34),(r34,r31),(r35,r39),(r39,r35),(r37,r38),(r38,r37)}

# -----------------------------------------------------------------------
# [twocolors] -- deliberate UNSAT pairing for [main], built for this
# thesis project's SAT/UNSAT benchmark scenario (msc-4, Trong-Nghia Be).
# This is NOT the trivial "zero out a class" shape this suite's own review
# explicitly warned against (compare 08-AggregationComposition/
# FileSystem_default.properties's [cycle]/[sharing] sections, which force
# a contradiction the same way: keep the model fully and normally
# populated, and let exactly one bound collide with exactly one
# invariant). Every one of the 40 Regions, the identical 67-edge Adjacent
# literal, and both invariants (properColoring, noSelfLoop) are copied
# unchanged from [main] below -- the ONLY change in this entire section is
# Integer_max: 3 -> 2, i.e. Region.color may now only take the values 1
# or 2.
#
# WHY THIS IS A GENUINE, NON-TRIVIAL CONTRADICTION (not just "fewer
# values happen to be available"): a graph is 2-colorable (bipartite) if
# and only if it contains no odd-length cycle (standard graph-theory
# fact). This fixed graph does contain one -- independently re-confirmed
# here by walking the exact Adjacent edge list above, not merely assumed
# from the model's "3-chromatic by construction" framing in
# GraphColoring.use's header:
#     r15 -> r21 -> r18 -> r1 -> r25 -> r10 -> r13 -> r15
# a genuine 7-cycle (odd length), every one of whose 7 edges is present in
# the Adjacent literal above (both directions). Going around this cycle
# with only 2 available colors forces two adjacent Regions on it to share
# a color no matter how the other 6 are assigned (pigeonhole on an odd
# cycle: alternating 2 colors around an odd-length loop always collides at
# the closing edge) -- so properColoring is provably violated for at least
# one edge of this specific cycle in EVERY possible coloring, while every
# other Region/edge in the model is exactly as populated and constrained
# as in the working [main] section. The 3-colorability of the same graph
# (see [main] / GraphColoring.use) does not contradict this: 3 colors are
# enough to break the odd cycle by rotating through a third color once
# around it, 2 colors are not.
#
# CONFIRMED BY ACTUALLY RUNNING THE SOLVER: `mv -validate
# GraphColoring.properties twocolors` at bitwidth 8 (the SAME bitwidth as
# [main] -- kept unchanged since color's declared range here, 1..2, is
# trivially covered by 8 bits, and there is no reason to expect the
# low-bitwidth false-negative documented in this file's header for the
# k=3/[main] instance to apply differently here) returns UNSATISFIABLE,
# and quickly (double-digit milliseconds, not the several-second search
# [main] requires) -- Kodkod's own propagation finds the odd-cycle
# contradiction almost immediately, without needing a deep search.
# -----------------------------------------------------------------------

[twocolors]

Integer_min = 1
Integer_max = 2

Region_min = 40
Region_max = 40
Region = Set{r0,r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,r11,r12,r13,r14,r15,r16,r17,r18,r19,r20,r21,r22,r23,r24,r25,r26,r27,r28,r29,r30,r31,r32,r33,r34,r35,r36,r37,r38,r39}
Region_name = Set{'R0','R1','R2','R3','R4','R5','R6','R7','R8','R9','R10','R11','R12','R13','R14','R15','R16','R17','R18','R19','R20','R21','R22','R23','R24','R25','R26','R27','R28','R29','R30','R31','R32','R33','R34','R35','R36','R37','R38','R39'}

