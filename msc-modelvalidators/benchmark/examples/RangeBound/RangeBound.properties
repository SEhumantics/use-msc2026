# -----------------------------------------------------------------------
# RangeBound.properties -- per-attribute NUMERIC RANGE bounds (the
# config.attribute-bounds half that enumerated Set{} domains do not cover).
# [main]: range [10,20], invariant level >= 10 -- SATISFIABLE.
# [unsat]: same range, invariant level <= 5 -- the range forbids every
# demanded value: UNSATISFIABLE. Both verdicts are range-driven: no
# enumerated candidate list exists.
#
# KEY-SEMANTICS DIVERGENCE (documented, deliberate): this tool reads
# <Attr>_min/_max as a VALUE RANGE; the Kodkod incumbent reads the SAME
# keys as a COUNT OF DEFINED OBJECTS carrying the attribute
# (AttributeConfigurator.setLimits/numberOfDefinedValues) -- so here kk
# demands 10..20 defined objects where only 1 exists and collapses to
# TRIVIALLY_UNSATISFIABLE (observed, all five SAT backends). USE has no
# defined-count concept for plain attributes, so the value-range reading
# is the one this tool implements; the divergence is recorded in the
# feature matrix row config.attribute-bounds.
# -----------------------------------------------------------------------

[main]

Sensor_min = 1
Sensor_max = 1

Sensor_level_min = 10
Sensor_level_max = 20

Sensor_levelAboveFloor = active
Sensor_levelBelowFloor = inactive

[unsat]

Sensor_min = 1
Sensor_max = 1

Sensor_level_min = 10
Sensor_level_max = 20

Sensor_levelBelowFloor = active
Sensor_levelAboveFloor = inactive
