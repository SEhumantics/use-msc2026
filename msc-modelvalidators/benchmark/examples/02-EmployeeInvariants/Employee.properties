Integer_min = 0
Integer_max = 3

Employee_min = 1
Employee_max = 2

Employee_PositiveSalary = active
Employee_NotBelowMinusOne = active

# -----------------------------------------------------------------------
# [belowThreshold] -- deliberate UNSATISFIABLE companion to the section
# above, built to pair with it as a SAT/UNSAT benchmark scenario over the
# SAME model and the SAME two invariants (no new class, no zeroed
# population -- Employee_min/max is left exactly as populated as the SAT
# section above).
#
# The two invariants are NOT independent (see the model header and
# invIndep.cmd): PositiveSalary (salary > 0, i.e. salary >= 1) logically
# implies NotBelowMinusOne (salary > -1, i.e. salary >= 0). That makes
# salary = 0 the exact boundary value that satisfies NotBelowMinusOne
# while already violating PositiveSalary. This section pins the entire
# candidate Integer domain to end exactly at that boundary
# (Integer_max = 0), so:
#   - NotBelowMinusOne remains trivially satisfiable (0 > -1 holds for
#     every candidate value in range, so this invariant alone imposes no
#     real restriction here).
#   - PositiveSalary requires some candidate value > 0, and none exists
#     anywhere in the bounded domain [-3, 0] -- every one of the
#     Employee objects that Employee_min/max still forces to exist (1-2,
#     same as the SAT section) needs a salary value the solver simply has
#     no candidate for.
# Both invariants stay `active`, exactly as in the SAT section, so
# -validate must satisfy them jointly. The model itself is unchanged and
# still fully populated (1-2 Employee objects, not an empty universe, and
# no class bound set to 0) -- the contradiction is a genuine domain/
# invariant-direction conflict, not a vacuous "nothing exists" case.
#
# Verified by actually running `mv -validate Employee.properties
# belowThreshold` (see /tmp throwaway .cmd used during authoring): reports
# UNSATISFIABLE.
# -----------------------------------------------------------------------

[belowThreshold]

Integer_min = -3
Integer_max = 0

Employee_min = 1
Employee_max = 2

Employee_PositiveSalary = active
Employee_NotBelowMinusOne = active
