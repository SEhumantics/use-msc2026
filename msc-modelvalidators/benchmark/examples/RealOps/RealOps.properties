# -----------------------------------------------------------------------
# RealOps.properties -- unc-modelvalidator bounds for RealOps.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) to give the
# Real-widened abs/min/max (the last shape of the prim.integer-arithmetic
# arithmetic surface) a wired benchmark scenario.
#
# [main] is SATISFIABLE: value {3.0}, reference {3.5}, tolerance {1.0} --
# |3.0 - 3.5| = 0.5 <= 1.0, and min(3.0, 3.5) = 3.0 = value.
#
# [unsat] is UNSATISFIABLE: the tolerance narrows to {0.2}, so
# |3.0 - 3.5| = 0.5 > 0.2 -- withinTolerance is genuinely violated over a
# fully populated model.
# -----------------------------------------------------------------------

[main]

Real_min = 0.0
Real_max = 10.0

Reading_min = 1
Reading_max = 1

Reading_value = Set{3.0}
Reading_reference = Set{3.5}
Reading_tolerance = Set{1.0}

Reading_withinTolerance = active
Reading_valueIsTheMinimum = active

[unsat]

Real_min = 0.0
Real_max = 10.0

Reading_min = 1
Reading_max = 1

Reading_value = Set{3.0}
Reading_reference = Set{3.5}
Reading_tolerance = Set{0.2}

Reading_withinTolerance = active
Reading_valueIsTheMinimum = active
