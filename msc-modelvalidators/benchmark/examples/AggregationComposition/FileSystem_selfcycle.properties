# -----------------------------------------------------------------------
# FileSystem_selfcycle.properties -- unc-modelvalidator + Kodkod bounds for
# FileSystem.use, "selfcycle" config: aggregationcyclefreeness = OFF, with a
# 2-tuple SELF-REFERENTIAL cycle forced through the SINGLE composition
# association PrimaryContains alone (f1 primaryParent-of f2 AND f2
# primaryParent-of f1 -- both links through the SAME association, unlike the
# [cycle] sections of FileSystem_default/FileSystem_off which close a 2-hop
# cycle ACROSS PrimaryContains and AltContains).
#
# This section is the corpus evidence for the Study B (RQ2 supersession) row
# AggregationComposition-SelfCycle. FileSystem.use's own header documents the
# incumbent defect this row exhibits: a cycle formed by a SINGLE
# aggregation/composition association is compiled into an UNCONDITIONAL
# Kodkod constraint that IGNORES the aggregationcyclefreeness toggle -- so
# even with the toggle explicitly OFF, the incumbent refuses this model.
# Ground truth: the toggle OFF says cycles are allowed, the forced links are
# exactly the two written here, every class and link bound is satisfiable.
# FileSystem.use's four constraints stay active (nothing here deactivates
# any of them): Folder::nameNotEmpty and Folder::notOwnPrimaryParent are
# genuinely checked against f1/f2 and hold (neither is its own primary
# parent, per the very links forced above); File::sizePositive and
# Archive::nameNotEmpty hold only vacuously, since File_min/max and
# Archive_min/max are both 0 here -- a satisfying instance demonstrably
# exists (the two-link Folder graph itself). unc-modelvalidator honors the
# toggle, accepts the forced cycle, and reconstructs it; USE's own
# checkStructure() still prints the cycle warning on the reconstructed
# diagram (that detection is not config-gated -- see MSystemState's
# checkWholePartLink) while the plugin no longer treats it as an error.
#
# Every association in the model is bounded explicitly: the unmentioned-
# association fallback (defaults to exactly one link) that the
# FileSystem_default.properties header documents would otherwise silently
# add links.
# -----------------------------------------------------------------------

[selfcycle]

aggregationcyclefreeness = off

Integer_min = 1
Integer_max = 5

Folder_min = 2
Folder_max = 2
Folder = Set{f1,f2}
Folder_name = Set{'Root','Sub'}

# The forced self-referential cycle THROUGH the single PrimaryContains
# composition: f1 is f2's primary parent AND f2 is f1's primary parent.
PrimaryContains = Set{(f1,f2),(f2,f1)}
PrimaryContains_min = 2
PrimaryContains_max = 2

AltContains_min = 0
AltContains_max = 0

File_min = 0
File_max = 0
MediaFile_min = 0
MediaFile_max = 0
Archive_min = 0
Archive_max = 0

FolderHasFile_min = 0
FolderHasFile_max = 0
ArchiveHasMedia_min = 0
ArchiveHasMedia_max = 0
