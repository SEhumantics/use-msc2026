# -----------------------------------------------------------------------
# PriceCalc.properties -- unc-modelvalidator bounds for PriceCalc.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) specifically to
# give binary '*', unary '+', class-bounds named objects, and an
# association-bounds explicit link-tuple literal a real, wired benchmark
# scenario -- each already had a passing dedicated unit fixture elsewhere
# in this project, but no corpus scenario exercised any of them until now.
#
# [main] is SATISFIABLE: doubledPrice's domain {10,20,30} is exactly
# 2x unitPrice's domain {5,10,15}, so every Product can satisfy
# doublePriceCheck (unitPrice*2=doubledPrice) regardless of which
# repeated value the solver happens to assign each of the 3 named
# Products (Set{} domains are shared candidate pools, not positional
# per-object pinning -- see this project's own established convention).
#
# [mismatched] is UNSATISFIABLE: doubledPrice's domain is shifted by +1
# to {11,21,31}, which contains NO value equal to 2x any candidate in
# unitPrice's own domain {5,10,15} (2*5=10, 2*10=20, 2*15=30 -- none of
# which is 11, 21, or 31). No assignment of any of the 3 Products can
# satisfy doublePriceCheck, so this is a genuine, non-vacuous
# contradiction -- the model stays fully populated (3 Products, 1
# Warehouse, all 3 Stores links forced), not an empty-universe trick.
# -----------------------------------------------------------------------

[main]

Integer_min = 1
Integer_max = 30

Product_min = 3
Product_max = 3
Product = Set{apple, banana, cherry}
Product_name = Set{'Apple', 'Banana', 'Cherry'}
Product_unitPrice = Set{5, 10, 15}
Product_doubledPrice = Set{10, 20, 30}

Warehouse_min = 1
Warehouse_max = 1
Warehouse = Set{mainWarehouse}
Warehouse_name = Set{'Main'}

Stores_min = 3
Stores_max = 3
Stores = Set{(mainWarehouse,apple),(mainWarehouse,banana),(mainWarehouse,cherry)}

Product_doublePriceCheck = active
Product_positiveUnitPrice = active

[mismatched]

Integer_min = 1
Integer_max = 31

Product_min = 3
Product_max = 3
Product = Set{apple, banana, cherry}
Product_name = Set{'Apple', 'Banana', 'Cherry'}
Product_unitPrice = Set{5, 10, 15}
Product_doubledPrice = Set{11, 21, 31}

Warehouse_min = 1
Warehouse_max = 1
Warehouse = Set{mainWarehouse}
Warehouse_name = Set{'Main'}

Stores_min = 3
Stores_max = 3
Stores = Set{(mainWarehouse,apple),(mainWarehouse,banana),(mainWarehouse,cherry)}

Product_doublePriceCheck = active
Product_positiveUnitPrice = active
