# CivilStatus.properties -- Kodkod ModelValidator bounds for CivilStatusWorld
# (model: kk-modelvalidator/examples/04-CivilStatus/CivilStatus.use)
#
# The original civstat.use tutorial archive shipped NO ModelValidator config
# at all -- this file is authored from scratch to match its classes and
# invariants, scaled down to a search space that solves in a few seconds
# (a handful of Person objects, a tiny explicit name domain, small Integer
# bounds), not to any "academic-scale" bound.

# ---- Global type bounds ---------------------------------------------------
# Person has no Integer-typed attribute, and none of the invariants that
# actually survive transformation (see below) reference Integer either, so
# this bound is likely inert for this particular model. Kept small and
# explicit anyway, for documentation and in case the model is extended.
Integer_min = -2
Integer_max = 8

# ---- Person ----------------------------------------------------------------
# 2..4 Person objects: enough room for one married couple plus a third
# person left single/divorced/widowed, without letting the per-object search
# space (name x civstat x gender x alive) grow past a few seconds.
Person_min = 2
Person_max = 4

# Restrict the String attribute "name" to a small explicit domain instead of
# leaving it to the generic String type bounds (which would let the solver
# invent arbitrary distinct string atoms). Four candidates exactly matches
# Person_max, keeping the nameIsUnique distinctness check tight.
Person_name = Set{'Ann','Bob','Cid','Dee'}

# attributesDefined (below) already forces every attribute to be defined on
# every Person, so the generic "how many objects have this attribute
# defined" bounds (Person_name_min/max, Person_civstat_min/max, ...) are
# intentionally left at their default (unrestricted) rather than duplicated
# here. civstat/gender/alive are enum/Boolean-typed and already tightly
# bounded by declaration (4, 2, 2 possible values) -- not narrowed further.

# ---- Marriage association ---------------------------------------------------
# At most 2 disjoint (wife, husband) pairs fit in 4 Person objects, given the
# [0..1]/[0..1] role multiplicities already declared in CivilStatus.use.
Marriage_min = 0
Marriage_max = 2

# ---- Invariants --------------------------------------------------------------
Person_attributesDefined = active
Person_nameIsUnique = active
Person_femaleHasNoWife = active
Person_maleHasNoHusband = active

# nameCapitalThenSmallLetters uses String.substring(...) and String.size --
# neither has a corresponding transformation method anywhere in this
# plugin's OCL operation groups (org.tzi.kodkod.ocl.operation: Any, Boolean,
# Integer, Set, Class, Conditional, CollectionConstructor, Variable -- no
# String group at all). Marking it "inactive" here is really just
# documentation of intent: the model loader tries to transform every
# invariant unconditionally when CivilStatus.use is loaded;
# InvariantTransformator.transformAndAdd(...) will catch the resulting
# TransformationException for THIS invariant specifically, log it as an
# error ("OCL operation substring is not supported"), and silently drop the
# invariant from the search -- it is never enforced by -validate/-invIndep/
# -scrollingAll regardless of what this line says. Expect (and ignore) that
# one logged transformation error when loading this model.
Person_nameCapitalThenSmallLetters = inactive

# ---- scrolling: a much smaller, self-contained section for -scrollingAll ---
# The [small] bounds above (2-4 Persons, unrestricted civstat/gender/alive
# per object) are intractable for FULL enumeration: confirmed by actually
# running `mv -scrollingAll CivilStatus.properties` -- it did not finish in
# 60s and was killed. Kodkod ModelValidator .properties sections are fully
# independent (nothing here is inherited from the section above), so this
# is a separate, deliberately tiny config: exactly 2 Persons, exactly 2
# names, confirmed to enumerate completely in well under a second.
[scrolling]

Integer_min = -2
Integer_max = 8

Person_min = 2
Person_max = 2
Person_name = Set{'Ann','Bob'}

Marriage_min = 0
Marriage_max = 1

Person_attributesDefined = active
Person_nameIsUnique = active
Person_femaleHasNoWife = active
Person_maleHasNoHusband = active
Person_nameCapitalThenSmallLetters = inactive

# ---- everyoneMarried: deliberately UNSATISFIABLE, paired with the section
# above -- forces more Marriage links than an odd Person population can
# structurally support ------------------------------------------------------
#
# This is NOT a trivial "class bound set to 0" / empty-universe UNSAT. The
# universe is populated exactly as normally (3 live Persons, all attributes
# defined, names unique) -- the contradiction is a genuine parity mismatch
# between the Marriage association's forced lower bound and what the
# model's OWN invariants allow the association to contain, given an odd
# Person population.
#
# Why the Marriage association can hold at most floor(Person_max/2) links,
# regardless of how the solver splits gender (traced directly from
# CivilStatus.use, not asserted):
#   - Marriage is declared `Person [0..1] role wife -- Person [0..1] role
#     husband`, i.e. for any link (a,b), a occupies the wife end and b the
#     husband end, and each end's 0..1 multiplicity means: per object at
#     the OTHER end, at most one linked object at THIS end. So each Person
#     can be the "a" (wife-end) of at most one link, and each Person can be
#     the "b" (husband-end) of at most one link.
#   - femaleHasNoWife (gender=female implies wife.isUndefined) forces: any
#     Person occupying the husband end of a link (i.e. whose `wife` is
#     defined) cannot be female -- so husband-end occupants are male.
#   - maleHasNoHusband (gender=male implies husband.isUndefined) forces:
#     any Person occupying the wife end of a link (i.e. whose `husband` is
#     defined) cannot be male -- so wife-end occupants are female.
#   - Both invariants stay active below (required for this contradiction to
#     be genuine -- without them a single Person could chain-occupy the
#     wife end of one link AND the husband end of another, and 2 links
#     would fit in 3 Persons after all; this was checked by hand-tracing
#     the invariants, not assumed).
#   - Since gender is a single mandatory attribute (attributesDefined stays
#     active), no Person can be both a wife-end and a husband-end occupant.
#     So Marriage is a genuine 1-1 matching between the female subset and
#     the male subset of the population: its size is bounded by
#     min(#female, #male) <= floor(Person_max/2), for EVERY possible
#     female/male split the solver could choose.
#
# With Person_min=Person_max=3 (odd), floor(3/2)=1, so at most 1 Marriage
# link can ever exist under any gender split (0F/3M, 1F/2M, 2F/1M, 3F/0M
# all give min(#F,#M) <= 1). Marriage_min=2 below demands at least 2 --
# i.e. it demands 4 person-participations in links (2 links x 2 role-slots
# each with no Person reused, per the matching argument above) from a
# population of only 3 Persons. That is exactly the "every Person required
# to be married but an odd/insufficient candidate pairing count" shape
# described for this example, and it fails on the Marriage association /
# Person population interaction specifically -- every other bound and
# invariant here is left exactly as populated as the SAT section above
# (same Integer bounds, same four invariants active, same
# nameCapitalThenSmallLetters caveat).
[everyoneMarried]

Integer_min = -2
Integer_max = 8

# Odd population: no gender split of 3 Persons can produce 2 disjoint
# (female,male) pairs -- see the matching argument above.
Person_min = 3
Person_max = 3
Person_name = Set{'Ann','Bob','Cid'}

# The actual contradiction: demands 2 links, but the model's own invariants
# cap this association at floor(Person_max/2)=1 link when Person_max=3.
Marriage_min = 2
Marriage_max = 2

Person_attributesDefined = active
Person_nameIsUnique = active
Person_femaleHasNoWife = active
Person_maleHasNoHusband = active
Person_nameCapitalThenSmallLetters = inactive
