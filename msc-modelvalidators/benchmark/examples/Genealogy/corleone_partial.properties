/* Bounds for the "Partial solution completion" use case (see
partialCompletion.cmd and partial-state.soil). A separate small file from
corleone.properties (matching the corleone_invIndep.properties pattern)
so the hand-built partial state's own name/attribute vocabulary and class
bounds can be kept minimal and self-contained.

The [completion] section only needs to describe the FINAL, completed
family: Person_min/max=4 asks the search to add exactly 2 more Person
objects around the 2 already loaded from partial-state.soil (Vito,
Michael), and Parenthood_min/max=1..3 lets it add up to 2 more links
around the 1 already present (Vito parent-of Michael). The fName/lName/
yearB sets include the two hand-built values verbatim ('Vito'/'Michael',
'Corleone', 0/30) plus a couple of extra choices for the newly-added
Persons.

Suggested USE shell session (only "mv", not "modelvalidator", works when
commands are read from a .cmd script file):

  open Genealogy.use
  open partial-state.soil
  mv -config automaticDiagramExtraction := on
  mv -validate corleone_partial.properties completion

Expected/confirmed result: SATISFIABLE, 4 Person / 2 Parenthood in the
final state, with Vito and Michael (and the link between them) surviving
into the solution completely unchanged -- see partialCompletion.cmd for
the actual OCL checks and the exact numbers observed by running it.
*/

[completion]
Integer_min = 0
Integer_max = 127

Person_min = 4
Person_max = 4
Person_fName = Set{'Vito','Michael','Sonny','Fredo'}
Person_lName = Set{'Corleone'}
Person_yearB = Set{0,15,30,45}

Parenthood_min = 1
Parenthood_max = 3

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive
