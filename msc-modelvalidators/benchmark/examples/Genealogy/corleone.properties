/* Adapted (with much smaller bounds) from the Person/Parenthood
("Corleone family") examples in section "Validation and Verification
Use Cases" of:
  M. Gogolla, F. Hilken, K.-H. Doan: "Achieving Model Quality through
  Model Validation, Verification and Exploration", Computer Languages,
  Systems & Structures (COMLAN), Database Systems Group, University of
  Bremen. See the attribution note shipped with this example.

No working corleone.properties file exists in the source archive --
every section below is reconstructed from bound snippets quoted in the
paper's LaTeX prose and rescaled to solve in a few seconds. (The
paper's own 10..10 Person / 11..11 Parenthood config for "model
consistency" used real calendar years 1891-1953, needed an explicit
"mv -config bitwidth:=12" override, and its "property satisfiability"
run alone took about 16s of solving time -- all avoided here by using
small synthetic year numbers and fewer objects.)

Suggested USE shell session (only the "mv" alias, not "modelvalidator",
works when commands are read from a .cmd script file):

  open genealogy.use
  mv -validate corleone.properties consistency
  mv -validate corleone.properties satisfiability
  mv -validate corleone.properties implication_check
  mv -validate corleone.properties implication_sanity
  mv -validate corleone.properties equivalence_check
  mv -validate corleone.properties equivalence_one_check
  mv -scrollingAll corleone.properties scrolling
  mv -validate corleone.properties generation_gap_overflow
*/

[consistency]
# "Model consistency" use case (paper: 10 Person / 11 Parenthood,
# real years 1891-1953 -- scaled down here to 6 Person / 4..8 links,
# synthetic years). Expected result: SATISFIABLE.
Integer_min = 0
Integer_max = 127

Person_min = 6
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 4
Parenthood_max = 8

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[satisfiability]
# "Property satisfiability" use case (paper: 15 Person / 14 Parenthood
# links, a complete 4-level binary tree -- scaled down here to a
# complete 3-level binary tree: 7 Person / 6 Parenthood links).
# Expected result: SATISFIABLE.
Integer_min = 0
Integer_max = 127

Person_min = 7
Person_max = 7
Person_fName = Set{'Ada','Bob','Cyd','Dan'}
Person_lName = Set{'Alewife','Baker'}
Person_yearB = Set{0,20,40,60}

Parenthood_min = 6
Parenthood_max = 6

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = active
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[implication_check]
# "Constraint implication" use case, broad half of the paper's
# broadConf/narrowConf pair: negate grandparentOlderGrandchild.
# Expected result: UNSATISFIABLE (i.e. implied by the base invariants).
Integer_min = 0
Integer_max = 127

Person_min = 0
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 0
Parenthood_max = -1

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = negate
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[implication_sanity]
# Sanity-check half (paper's narrowConf): same invariant in its normal,
# non-negated form under an exact small bound. Expected result:
# SATISFIABLE -- confirms the "implication_check" UNSAT above was
# caused by the negation, not by an unrelated inconsistency.
Integer_min = 0
Integer_max = 127

Person_min = 4
Person_max = 4
Person_fName = Set{'Vito','Carmela','Sonny','Michael'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 4
Parenthood_max = 4

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = active
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[equivalence_check]
# "Equivalence implication" use case, narrow config (paper: 6 Person /
# 5 Parenthood links): negate the EQUIV invariant. Expected result:
# UNSATISFIABLE, i.e. parent_0_2_size and parent_0_2_Set really are
# equivalent formulations of "0..2 parents".
Integer_min = 0
Integer_max = 127

Person_min = 6
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 5
Parenthood_max = 5

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = active
Person_parent_0_2_Set = active
Person_parent_0_2_size_EQUIV_parent_0_2_Set = negate
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[equivalence_one_check]
# Same bounds, but negating the intentionally-broken "_ONE" variant
# (inner "exists" replaced by "one"). Expected result: SATISFIABLE, i.e.
# the model validator finds a genuine counterexample, as in the paper.
Integer_min = 0
Integer_max = 127

Person_min = 6
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 5
Parenthood_max = 5

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = active
Person_parent_0_2_Set = active
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = negate

[scrolling]
# "Solution interval exploration" use case (paper: 3 Person / 2
# Parenthood links, expected 6 solutions) -- kept at the paper's own
# tiny size, only the real years 1950/1965 replaced by 0/20.
Integer_min = 0
Integer_max = 127

Person_min = 3
Person_max = 3
Person_fName = Set{'Ada','Bob','Cyd'}
Person_lName = Set{'Alewife'}
Person_yearB = Set{0,20}

Parenthood_min = 2
Parenthood_max = 2

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[generation_gap_overflow]
# Deliberate UNSAT companion to [consistency] above -- SAME model, ONE
# genuine contradiction, mirroring the paired-mutation pattern used by
# AggregationComposition/FileSystem_default.properties's own [cycle]
# section (see that file's header note) and RecursiveTree/
# Tree.properties's [forcedCycle] section.
#
# parentOlderChild requires every single parent-child hop to advance
# yearB by at least 15 (p.yearB+15<=c.yearB). A real 4-generation chain
# -- grandparent -> parent -> child -> grandchild, i.e. 3 CHAINED
# Parenthood hops -- therefore forces a cumulative gap of
# gc.yearB >= gp.yearB+45 end-to-end, regardless of how the 3 individual
# +15 margins are distributed along the way. The 4 Person objects and
# the 3 links between them are pinned by name below (Person = Set{...},
# Parenthood = Set{(gp,pa),(pa,ch),(ch,gc)}) specifically so the solver
# cannot dodge the long chain by re-shaping the family tree into a
# shallower, easier-to-satisfy "star" (one parent, 3 direct children,
# needing only a single +15 hop) the way an unpinned
# Person_min/max=4 / Parenthood_min/max=3 population could -- that
# freedom is exactly what makes bare population/link COUNT bounds
# insufficient to force this contradiction, and why explicit identity
# pinning (as in the two precedent sections above) is required here too.
#
# Person_yearB is then restricted to Set{0,10,20,30} -- a span of only
# 30 -- which can never reach the required 45, no matter which of the 4
# candidate years lands on which pinned individual. fName/lName/yearB
# are deliberately left as genuine PER-OBJECT CHOICES from these
# candidate sets (nothing here pins an attribute value directly), so
# this is a real search-exhausted UNSATISFIABLE over the year domain --
# not a TRIVIALLY_UNSATISFIABLE fully-pinned literal like the two
# precedent [cycle]/[forcedCycle] sections above (both of which pin
# every object AND every attribute, leaving zero free Kodkod variables).
# Confirmed both ways by actually running the solver: widening
# Person_yearB to Set{0,20,40,60,80,100} (span 100, comfortably >=45)
# against this exact same pinned 3-hop chain flips the outcome to
# SATISFIABLE -- so the UNSAT below is really coming from the year
# domain being too tight for the chain, not from some unrelated
# structural mistake.
#
# acyclicParenthood and nameUnique both remain independently
# satisfiable for this exact chain -- it is a straight line, not a
# cycle, and 4 distinct fName candidates exist for the 4 people -- so
# parentOlderChild is isolated as the ONE invariant that actually fails;
# the rest of the model is populated normally. Expected result:
# UNSATISFIABLE.
#
# DISCOVERY (confirmed empirically while building this, not documented
# anywhere upstream, and going a step further than the discovery note in
# FileSystem_default.properties): a concrete Set{} literal for an
# association only reliably overrides that association's implicit
# no-config-file default bound ("exactly one link", per Usage.pdf) when
# the literal names EXACTLY ONE tuple -- every single-tuple Set{}
# literal already in this repo's *.properties files (Tree.properties's
# forcedCycle, FileSystem_default.properties's [cycle]/[sharing]) only
# ever exercises that one-tuple case. A literal naming TWO OR MORE
# tuples with no explicit _min/_max alongside it was found to still get
# the implicit "exactly one link" default -- which directly contradicts
# a >=2-tuple literal and makes the section UNSATISFIABLE for a reason
# that has nothing to do with parentOlderChild or the year domain at
# all. Reproduced in isolation with acyclicParenthood/parentOlderChild
# each independently turned off, and with a completely generous year
# domain -- all still UNSATISFIABLE until Parenthood_min/_max were added
# explicitly. Explicit Parenthood_min=3/Parenthood_max=3 below (matching
# the 3-tuple literal exactly) is REQUIRED for that reason -- it is not
# redundant with the Set{} literal above it, unlike the single-tuple
# associations in the other example files.
Integer_min = 0
Integer_max = 127

Person_min = 4
Person_max = 4
Person = Set{gp,pa,ch,gc}
Person_fName = Set{'Vito','Sonny','Michael','Anthony'}
Person_lName = Set{'Corleone'}
Person_yearB = Set{0,10,20,30}

# Pin the exact 3-hop chain: gp parent-of pa, pa parent-of ch, ch
# parent-of gc. Parenthood_min/max=3 is REQUIRED alongside this literal
# (see the DISCOVERY note above) -- omitting it left the implicit
# no-config-file default of "exactly one link" in force, which
# contradicts this 3-tuple literal on its own, independently of
# parentOlderChild or the year domain.
Parenthood = Set{(gp,pa),(pa,ch),(ch,gc)}
Parenthood_min = 3
Parenthood_max = 3

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive
