# -----------------------------------------------------------------------
# Redefines.properties -- Kodkod ModelValidator bounds for Redefines.use
#
# Both sections pin every object and every link to an explicit named
# literal (A = Set{a1}, AB = Set{(a1,b1)}, etc.) rather than leaving them to
# the solver's own choice. This was deliberate, not just tidiness:
# an EARLIER, unpinned draft of this same 4-object/1-link-per-association
# shape (A_min/max=1, AB_min/max=1 etc., no Set{} literals) let Kodkod
# freely choose the AB link's participants -- and it repeatedly chose
# (c1,d1) for it, the exact pair that is invalid because CD already
# redefines that slot. Object-diagram reconstruction then logged
# "ERROR: Error during object diagram creation Reason: Link creation
# failed!" for that link and silently dropped it (AB ended up with 0 links,
# not the requested 1) while STILL reporting outcome SATISFIABLE -- a
# second, distinct plugin gap from the one this example is built to
# demonstrate (see Redefines.use's own header comment for that one).
# Confirmed reproducible, but pinning every link via Set{} literals below
# sidesteps it entirely and keeps this file focused on exactly one finding.
#
# [default]: a clean, fully-consistent population -- a1/b1 linked only via
# AB, c1/d1 linked only via CD (redefining AB's slot for these two,
# per the model). D_tagD is genuinely 'child-d', so RedefinedRoleTagCheck
# (c.b->forAll(x|x.tagD='child-d')) is a real, honestly-satisfied
# constraint here -- confirmed SATISFIABLE with all 3 invariants OK via an
# independent `check -v` re-check.
#
# [translationGap]: IDENTICAL structure, except D_tagD is pinned to a value
# that does NOT satisfy RedefinedRoleTagCheck. Confirmed: the plugin still
# reports outcome SATISFIABLE (its own post-reconstruction log even prints
# "Invariant `C::RedefinedRoleTagCheck' is not fulfilled in generated
# system state" -- it notices -- but does not change the reported
# outcome or retry), while an independent `check -v` on the very same
# reconstructed state correctly reports RedefinedRoleTagCheck: FAILED.
# Root cause: the Kodkod encoding of "c.b" uses AB's own (empty, for a
# CD-only-linked C object) relation instead of substituting CD's "d" per
# the redefinition, so ...->forAll(...) over that empty relation is
# vacuously true no matter what tagD actually is.
# -----------------------------------------------------------------------

[default]
Integer_min = 0
Integer_max = 1

A_min = 1
A_max = 1
A = Set{a1}

B_min = 1
B_max = 1
B = Set{b1}

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

A_tagA = Set{'root-a'}
B_tagB = Set{'root-b'}
C_tagC = Set{'child-c'}
D_tagD = Set{'child-d'}

AB = Set{(a1,b1)}
CD = Set{(c1,d1)}

A_TagANotEmpty = active
B_TagBNotEmpty = active
C_RedefinedRoleTagCheck = active

[translationGap]
Integer_min = 0
Integer_max = 1

A_min = 1
A_max = 1
A = Set{a1}

B_min = 1
B_max = 1
B = Set{b1}

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

A_tagA = Set{'root-a'}
B_tagB = Set{'root-b'}
C_tagC = Set{'child-c'}
D_tagD = Set{'NOT-child-d'}

AB = Set{(a1,b1)}
CD = Set{(c1,d1)}

A_TagANotEmpty = active
B_TagBNotEmpty = active
C_RedefinedRoleTagCheck = active

# -----------------------------------------------------------------------
# [tagBoundGap] -- deliberate UNSATISFIABLE companion to [default] above,
# built to pair with it as a SAT/UNSAT benchmark scenario over the SAME
# model (same pattern as 08-AggregationComposition/FileSystem_default.
# properties's own [cycle]/[sharing] pair, and 07-Inheritance/Vehicle.
# properties's own [nonpositivewheels] companion to its default section).
#
# IMPORTANT: this section is deliberately NOT built around
# RedefinedRoleTagCheck (c.b->forAll(x | x.tagD = 'child-d')) -- see this
# file's own [translationGap] section above and Redefines.use's header
# comment for the plugin's confirmed soundness gap on that exact
# invariant: the Kodkod translator has no special-casing for `redefines`
# at all, so "c.b" is encoded using AB's own (empty, for a
# CD-only-linked C object) Kodkod relation, making RedefinedRoleTagCheck
# VACUOUSLY true during the search regardless of what tagD actually
# holds. Building an UNSAT case on top of that gap would produce a
# result that says nothing about the model itself (the search never
# actually constrains anything through that path) -- so this section
# never touches c.b/a.b navigation at all, and leaves
# RedefinedRoleTagCheck active with its normally-satisfying D_tagD value
# unchanged from [default] ('child-d').
#
# Instead the contradiction is built on TagBNotEmpty (context b: B inv
# TagBNotEmpty: b.tagB <> ''), a PLAIN, navigation-free class invariant
# that never goes through an association at all. tagB is declared on B
# and inherited by D (D < B) -- and per this plugin's own
# attribute-bounding rule (confirmed empirically here and in
# 07-Inheritance/Vehicle.properties's Vehicle_wheels/Car/Truck case:
# an attribute declared on a superclass is bounded under the DECLARING
# class's name only, never per-subclass), BOTH b1 (a direct B instance)
# and d1 (a D instance, hence also a B instance by generalization -- not
# by the CD/redefines link) draw their tagB value from the SAME candidate
# pool, B_tagB. [default] sets B_tagB = Set{'root-b'} (non-empty, so
# TagBNotEmpty trivially holds for both). This section instead narrows
# B_tagB to Set{''} -- the ENTIRE candidate domain is the empty string,
# so no assignment exists that lets EITHER b1 or d1 satisfy TagBNotEmpty.
# This is a genuine invariant-level contradiction, not an
# empty-universe/zero-bound trick: A/B/C/D population (A_min/max,
# B_min/max, C_min/max, D_min/max, all still 1/1) and the AB/CD links
# (Set{(a1,b1)}, Set{(c1,d1)}) are UNCHANGED from [default],
# TagANotEmpty remains ordinarily satisfiable (A_tagA is unchanged), and
# RedefinedRoleTagCheck's own D_tagD candidate is unchanged too -- only
# TagBNotEmpty is structurally unenforceable, and it fails purely through
# B's own class-level bound/generalization handling (which this plugin's
# other examples confirm works correctly), never through the
# `c.b`/`a.b` redefined-role path that [translationGap] exists to expose
# as broken.
#
# Verified by actually running `mv -validate Redefines.properties
# tagBoundGap` (see /tmp throwaway .cmd used during authoring): reports
# UNSATISFIABLE.
# -----------------------------------------------------------------------

[tagBoundGap]
Integer_min = 0
Integer_max = 1

A_min = 1
A_max = 1
A = Set{a1}

B_min = 1
B_max = 1
B = Set{b1}

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

A_tagA = Set{'root-a'}

# The entire candidate domain for tagB (declared on B, inherited by D) is
# the empty string -- no value exists that lets b1 OR d1 satisfy
# TagBNotEmpty (b.tagB <> ''). Neither b1 nor d1 is reached via a
# redefined-role navigation here; TagBNotEmpty quantifies directly over
# every B instance (B_min/max) and every D instance (D_min/max, via
# generalization), independent of the AB/CD association structure.
B_tagB = Set{''}

C_tagC = Set{'child-c'}
D_tagD = Set{'child-d'}

AB = Set{(a1,b1)}
CD = Set{(c1,d1)}

A_TagANotEmpty = active
B_TagBNotEmpty = active
C_RedefinedRoleTagCheck = active
