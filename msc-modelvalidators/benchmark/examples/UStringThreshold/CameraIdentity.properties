# The fourth and final U-type family: uncertain STRINGS, a representative spelling plus a
# confidence. archive2/robust_utype_model_finding_proposal.md's UString section fixes the rules:
#
#   against an exact string r:   p = c_s     if s = r
#                                p = 1 - c_s otherwise
#   between two UStrings, b = c_s * c_r:
#                                p = b       if the spellings match
#                                p = 1 - b   otherwise
#
# The second rule is a PRODUCT of two confidences. `and` was the nonlinear rule for UBoolean;
# c_s * c_r is the nonlinear rule here, and it is handled the same way: the proposal's default
# bounded encoding makes "configured spellings become a finite Z3 enumeration", the confidences
# are finite configured choices too, and every combination is composed by USE's own UString at
# TRANSLATION time. Nothing arithmetic reaches the solver -- only equalities between a spelling
# index or a confidence symbol and a literal.
#
# Observed with the real org.tzi.use.uncertainty.datatypes.UString:
#     UString('ALLY-7',0.70) = 'ALLY-7'                 -> 0.7
#     UString('ALLY-7',0.80) = 'ALLY-7'                 -> 0.8            (the exact >= tie)
#     UString('ALLY-7',0.95) = 'ALLY-7'                 -> 0.95
#     UString('ALLY-8',0.95) = 'ALLY-7'                 -> 0.050000000000000044
#     UString('ALLY-7',0.70) = UString('ALLY-7',0.85)   -> 0.595
#
# The proposal's own worked example, verbatim: "UString('ALLY-7',0.70) compared with exact
# 'ALLY-7' yields equality probability (0.70); a required confidence of (0.80) rejects it despite
# a matching spelling." The SPELLING MATCHES, so nominal erasure -- which reads a UString(s,c) as
# its representative spelling s and discards c outright -- accepts. The uncertainty-aware reading
# correctly rejects. This row is therefore simultaneously the nominal-erasure discrepancy witness
# for UString, and a blunter one than the other three families': the crisp reading here is not
# merely close to right, it ignores the measurement quality entirely.
[below]
Camera_min = 1
Camera_max = 1
Camera_id_value = Set{'ALLY-7'}
Camera_id_confidence = Set{0.7}
Camera_witness_value = Set{'ALLY-7'}
Camera_witness_confidence = Set{1.0}
Camera_ConfidentIdentity = active
Camera_Corroborated = inactive

# Exactly ON the threshold. toBooleanC is defined with >=, and 0.8 * 1.0 -- the exact string is
# lifted to confidence 1 by UStringValue.valueOf -- is bit-identical to the literal 0.80, so this
# row lands on the tie itself rather than near it.
[at]
Camera_min = 1
Camera_max = 1
Camera_id_value = Set{'ALLY-7'}
Camera_id_confidence = Set{0.8}
Camera_witness_value = Set{'ALLY-7'}
Camera_witness_confidence = Set{1.0}
Camera_ConfidentIdentity = active
Camera_Corroborated = inactive

[above]
Camera_min = 1
Camera_max = 1
Camera_id_value = Set{'ALLY-7'}
Camera_id_confidence = Set{0.95}
Camera_witness_value = Set{'ALLY-7'}
Camera_witness_confidence = Set{1.0}
Camera_ConfidentIdentity = active
Camera_Corroborated = inactive

# The finite spelling ENUMERATION doing real work, and the row that shows the encoding decides a
# SPELLING RELATION rather than carrying a string. Two candidate spellings are offered and only
# one of them matches the exact string the invariant names; the other yields 1 - 0.95 = 0.05,
# nowhere near the demanded confidence. The solver has to choose the matching index.
[spelling]
Camera_min = 1
Camera_max = 1
Camera_id_value = Set{'ALLY-7','ALLY-8'}
Camera_id_confidence = Set{0.95}
Camera_witness_value = Set{'ALLY-7'}
Camera_witness_confidence = Set{1.0}
Camera_ConfidentIdentity = active
Camera_Corroborated = inactive

# The row that exists BECAUSE the rule is a product, and the one thing UString-to-UString equality
# adds that comparison against an exact string cannot state. Both attributes offer TWO candidate
# confidences, so there are four combinations, and the solver has to find the one that satisfies
# both demands at once. Observed products with USE's own UString:
#     0.6  * 0.5 = 0.3                    under the 0.55 Corroborated demands
#     0.6  * 0.7 = 0.42                   under it too
#     0.85 * 0.5 = 0.425                  still under it
#     0.85 * 0.7 = 0.595                  clears it -- and 0.85 also clears ConfidentIdentity's 0.80
# Composed by USE's own UString at translation time, never emitted as a multiplication.
[corroborated]
Camera_min = 1
Camera_max = 1
Camera_id_value = Set{'ALLY-7'}
Camera_id_confidence = Set{0.6,0.85}
Camera_witness_value = Set{'ALLY-7'}
Camera_witness_confidence = Set{0.5,0.7}
Camera_ConfidentIdentity = active
Camera_Corroborated = active
