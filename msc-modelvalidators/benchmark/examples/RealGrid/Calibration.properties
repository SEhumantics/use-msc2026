# Study B supersession case B. Read by BOTH backends unchanged.
#
# Real_min/Real_max are set to EXACTLY the incumbent's own documented defaults
# (DefaultConfigurationValues.realMin = -2d, realMax = 2d). Real_step is left
# unset, so the incumbent uses its own default step of 0.5. Nothing here
# narrows the incumbent's grid: it is handed precisely the search space it
# would choose for itself.
Real_min = -2.0
Real_max = 2.0

Calibration_min = 1
Calibration_max = 1

# Per-attribute domain bounds, identical to the type-level range above, so the
# SMT finder searches the SAME interval the incumbent enumerates -- the only
# difference between the two searches is discretisation, not range. The
# incumbent has no per-attribute numeric-range key; it reads these as
# PropertyEntry.attributeDefValuesMin/Max (a count of defined values), fails to
# parse "-2.0" as an int, warns "The value for ... is not a number! The default
# value will be used" and falls back to its own defaults.
# SupersessionDivergenceTest re-runs the incumbent with these six keys removed
# entirely and asserts the outcome is unchanged.
Calibration_lowCut_min = -2.0
Calibration_lowCut_max = 2.0
Calibration_midCut_min = -2.0
Calibration_midCut_max = 2.0
Calibration_highCut_min = -2.0
Calibration_highCut_max = 2.0

Calibration_StrictlyIncreasing = active
Calibration_InsideUnitInterval = active
