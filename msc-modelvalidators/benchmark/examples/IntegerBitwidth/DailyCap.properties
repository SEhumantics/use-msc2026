# Study B supersession case A. Read by BOTH backends unchanged.
#
# The Integer type domain is 1..100. Both endpoints are representable at the
# corpus-wide bitwidth of 8 (-128..127), so the incumbent's own
# "configured bitwidth is too small" check -- which inspects Integer_min,
# Integer_max and configured specific values, and nothing else -- stays silent.
# It never looks at the literals INSIDE an invariant, and 100000000 is a
# literal inside an invariant.
#
# Every value in 1..100 satisfies Transfer::WithinDailyCap. The correct answer
# is therefore "satisfiable", and any of the hundred candidates witnesses it.
Integer_min = 1
Integer_max = 100

Transfer_min = 1
Transfer_max = 1

# Per-attribute domain bounds. The SMT finder needs these to register the
# attribute; the incumbent has no such key at all -- for it, Transfer_amountCents_min
# is PropertyEntry.attributeDefValuesMin, the number of DEFINED VALUES the
# attribute may hold. SupersessionDivergenceTest re-runs the incumbent with
# these two keys removed entirely and asserts the outcome is unchanged.
Transfer_amountCents_min = 1
Transfer_amountCents_max = 100

Transfer_WithinDailyCap = active
