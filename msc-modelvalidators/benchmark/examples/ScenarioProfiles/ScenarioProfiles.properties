# Milestone 4.6 -- durable, re-runnable evidence that EXISTS, COVER and UNIFORM are
# three DIFFERENT strengths of the same witness predicate.
#
# READ THIS BEFORE COMPARING THE TWO BACKENDS ON THESE ROWS.
# kk-modelvalidator SILENTLY IGNORES configuration keys it does not understand -- it
# does not reject them. Two things are therefore quietly dropped on the Kodkod side:
#   1. the `query = <profile> satisfy` key, which is not part of the incumbent's key
#      vocabulary at all; and
#   2. the UReal invariants themselves, because TypeConverter cannot represent UReal,
#      exactly as for examples/URealThreshold.
# Kodkod consequently reports TRIVIALLY_SATISFIABLE for EVERY section below, which is
# NOT a comparison with the SMT answer and must never be read as agreement or
# disagreement. Only the SMT-Z3 rows carry information here.
#
# SCENARIO-ENUMERATION CONVENTION: a scenario selects one configured uncertainty for
# every potentially live U-type attribute slot, so Sigma_K is the cross product over
# those slots. Each section configures ONE object slot carrying ONE UReal attribute
# with a TWO-valued _uncertainty domain, so |Sigma_K| = 2 everywhere below.
#
# The invariant pair carves out mu in [0.30 + z*sigma, 0.36 + z*sigma) with
# z = 1.6448534801602364 (USE's own realised 0.95 quantile):
#   sigma = 0.02 -> [0.3328970696, 0.3928970696)
#   sigma = 0.03 -> [0.3493456044, 0.4093456044)
#   sigma = 0.06 -> [0.3986912088, 0.4586912088)

# (a) EXISTS alone. mu = 0.35 satisfies sigma = 0.02 and misses sigma = 0.06, and no
#     other representative is configured.
[existsOnly]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = exists satisfy

[existsOnlyCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover satisfy

[existsOnlyUniform]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy

# (b) COVER succeeds with a DIFFERENT snapshot per scenario (mu = 0.35 for
#     sigma = 0.02, mu = 0.42 for sigma = 0.06); the two windows are disjoint, so
#     UNIFORM has no single shared representative and must fail.
[coverNotUniformCover]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = cover satisfy

[coverNotUniformUniform]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.35, 0.42}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.06}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy

# (c) A genuine shared UNIFORM witness: the sigma = 0.02 and sigma = 0.03 windows
#     overlap on [0.3493456044, 0.3928970696), and mu = 0.37 lies inside both.
[uniformShared]
UnidentifiedObject_min = 1
UnidentifiedObject_max = 1
UnidentifiedObject_speed_value = Set{0.37}
UnidentifiedObject_speed_uncertainty = Set{0.02, 0.03}
UnidentifiedObject_ConfidentlyFast = active
UnidentifiedObject_NotConfidentlyVeryFast = active
query = uniform satisfy
