# -----------------------------------------------------------------------
# Subsets.properties -- Kodkod ModelValidator bounds for Subsets.use
# (ported verbatim from use-core's own bundled
# examples/Others/Subsets/twoSubsets.use).
#
# The model: A/B are linked by association `ab` (both ends declared
# `union`). C<A/D<B are linked by `cd` (`c subsets a`, `d subsets b`).
# E<A/F<B are linked by `ef` (`e subsets a`, `f subsets b`). Per UML/OCL,
# a `union` end is *derived* as the union of every end that `subsets` it,
# so `ab` should always equal `cd` union `ef`, and every `cd`/`ef` link
# must therefore also be an `ab` link -- that containment is exactly what
# this example demonstrates and confirms by direct execution.
#
# THREE THINGS DISCOVERED EMPIRICALLY WHILE BUILDING THIS, none documented
# anywhere upstream, all confirmed by actually running the commands below
# (see validate.cmd/query.cmd for the exact transcripts):
#
# 1) The KK-ModelValidator plugin's Kodkod-side translator never reads
#    `subsets` at all: `grep -rn subset` over the plugin's entire
#    `src/main/java` returns zero hits. It DOES ship a dedicated
#    `org.tzi.kodkod.model.impl.UnionAssociation` class meant to give
#    `union` ends special Kodkod treatment, and a matching
#    `handleUnionAssociationNavigation` case in its OCL-to-Kodkod
#    translator -- but `grep -rn "new UnionAssociation"` over the same
#    tree also returns zero hits: nothing in the plugin ever actually
#    constructs one. So `ab` compiles as a completely ordinary,
#    independent binary association, exactly like `cd`/`ef` -- the SAT
#    encoding has no constraint whatsoever tying its content to theirs.
#    Confirmed directly: `ab_min`/`ab_max` below sets `ab`'s OWN Kodkod
#    relation to exactly 2 tuples, and the solver is free to (and does)
#    choose 2 tuples completely disjoint from `cd`'s and `ef`'s own links
#    (see query.cmd's `mv ? c1.b` / `mv ? e1.b`, which read that raw
#    relation directly and print the "wrong" partner -- f1/d1 instead of
#    d1/f1 -- every time this was run).
# 2) And yet the subsets containment DOES hold whenever the model is
#    inspected the ordinary way (plain OCL `?`, `check -v`, or any real
#    class invariant): USE CORE's own general-purpose OCL evaluator (a
#    completely separate code path from the Kodkod plugin, used for those
#    three) correctly implements `union` navigation as the live derived
#    union of `cd` and `ef` -- it does not consult `ab`'s own solved
#    Kodkod relation at all. Confirmed: no matter what `ab_min`/`ab_max`
#    bound is given -- including the deliberately contradictory
#    `ab_min=ab_max=0` in section `[boundIgnored]` below, requesting `ab`
#    be forced completely empty -- plain `? c1.b` still returns exactly
#    `cd`'s and `ef`'s own linked objects. A `union`-declared role's
#    OCL-visible content is therefore immune to whatever its own
#    properties-file bound asks for; only `cd`/`ef`'s bounds matter.
# 3) `info state`'s printed link COUNT for `ab` matches neither of the two
#    views above: it reports the SIZE OF THE SET UNION of `ab`'s own raw
#    solved relation together with `cd`'s and `ef`'s current links (i.e.
#    it silently merges the "wrong" raw pairing in (1) with the correct
#    derived links in (2), instead of picking one view consistently).
#    Confirmed arithmetic, all three actually run: `[demo]` below has a
#    raw `ab` relation of size 2 disjoint from `cd`+`ef`'s own 2 links,
#    and `info state` reports `ab: 4` (2+2, no overlap); `[boundIgnored]`
#    has a raw `ab` relation forced to size 0, `cd` contributing its own
#    1 link and `ef` contributing 0, and `info state` reports `ab: 1`
#    (0+1); a third, `ab_min=ab_max=3` variant (not shipped as a section
#    here, tried while developing this file) landed on a raw relation
#    that happened to already contain both `cd`'s and `ef`'s own links,
#    giving `info state: ab: 3` with no growth at all. `info state`'s
#    count for a `union`-declared association is therefore not reliable
#    evidence of what that association actually contains -- query it with
#    plain OCL `?` instead (exactly what query.cmd does).
#
# Net effect for a modeler: `union`+`subsets` together give you a role
# that always *behaves* correctly under ordinary OCL evaluation (finding
# 2), which is exactly what this example's query.cmd confirms -- but this
# happens entirely via USE core's pre-existing derived-union machinery,
# NOT via any Kodkod-level enforcement contributed by this plugin (finding
# 1), and the plugin's own `mv ?`/`info state` tooling can each show you a
# third, different, actively misleading number for the very same
# association at the very same solution (findings 1 and 3).
# -----------------------------------------------------------------------

[demo]

A_min = 0
A_max = 0
B_min = 0
B_max = 0

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

E_min = 1
E_max = 1
E = Set{e1}

F_min = 1
F_max = 1
F = Set{f1}

# cd/ef are ordinary associations between exactly-declared classes (C/D,
# E/F), so naming their tuples directly works fine.
cd = Set{(c1,d1)}
ef = Set{(e1,f1)}

# ab is declared between the SUPERCLASSES A/B, so a named Set{} literal
# using the subtype objects c1/d1/e1/f1 is rejected at load time
# ("Only defined objects of class A can be used" -- confirmed by actually
# trying it) -- see 08-AggregationComposition's FileSystem_default.properties
# for the identical restriction on ArchiveHasMedia/FolderHasFile. A plain
# numeric bound is used instead; per finding (1) above, the actual 2
# tuples the solver picks for it are unconstrained by cd/ef and (confirmed
# below) end up completely disjoint from both.
ab_min = 2
ab_max = 2

[boundIgnored]

# Same shape as [demo], but with E/F (and therefore ef) forced completely
# empty, and ab_min/ab_max forced to exactly 0 -- an explicit attempt to
# make `ab` contain nothing at all, contradicting cd's own non-empty link.
# Confirmed (finding 2 above): this request is honored for `ab`'s own raw
# Kodkod relation (which the solver duly makes empty), but has zero effect
# on what plain OCL navigation of the union role reports -- `? c1.b` still
# returns `d1`, `cd`'s own linked object, exactly as if no ab_min/ab_max
# had been given at all.

A_min = 0
A_max = 0
B_min = 0
B_max = 0

C_min = 1
C_max = 1
C = Set{c1}

D_min = 1
D_max = 1
D = Set{d1}

E_min = 0
E_max = 0
F_min = 0
F_max = 0

ef_min = 0
ef_max = 0

cd = Set{(c1,d1)}

ab_min = 0
ab_max = 0

[cdOverflow]

# UNSAT counterpart to [demo], built specifically to sidestep the
# subsets/union translation gap documented above: `boundIgnored` proves
# that a contradiction routed through ab's own bound (or, by the same
# mechanism, through cd/ef's subsets containment) is NEVER enforced by
# this plugin's Kodkod translator -- `subsets` is never read at all
# (finding 1), so the solver would just shrug and stay SATISFIABLE.
# This section instead forces a DIRECT bound infeasibility that has
# nothing to do with subsets/union: `cd` is an ordinary binary
# association between C and D (no multiplicity on either end beyond
# `*`, so USE core imposes no per-object degree constraint on it), and
# an ordinary association's tuples are a SET, so cd's total link count
# can never exceed |C|*|D| -- there are simply no more distinct (c,d)
# pairs than that. With C_max=2 and D_max=2 below, the whole model
# stays populated almost exactly like [demo]/[boundIgnored] (A/B still
# empty superclasses, C/D/E/F all inhabited, ab/ef both fully
# satisfiable), but cd_min is pushed to 5 -- one past the C_max*D_max=4
# ceiling implied by cd's own C/D population in THIS section. No
# assignment of tuples to cd can ever satisfy `cd_min = 5` here: this
# is a genuine pigeonhole/cardinality contradiction (not a trivial
# empty-class or empty-universe case -- every class involved has a
# strictly positive population), and it is a single, precisely
# identifiable failure: cd's own _min bound versus C/D's own _max
# bounds, with every other class/association in the section left
# exactly as satisfiable as it is in [demo].
#
# Confirmed by actually running `mv -validate Subsets.properties
# cdOverflow` (DefaultSAT4J, bitwidth 8, same config as [demo]): prints
# "UNSATISFIABLE" after a real (non-instant) solve attempt -- "Solving
# time: 3 ms", not a pre-solve trivial-bounds rejection -- and `info
# state` afterwards shows the prior empty state (no solution exists to
# report). As a boundary sanity check, lowering ONLY cd_min/cd_max from
# 5 to 4 (leaving every other bound in this section untouched) flips
# the very same run back to SATISFIABLE, with `info state` reporting
# exactly 6 objects (2 C + 2 D + 1 E + 1 F) and cd resolving to exactly
# 4 links -- confirming the contradiction is precisely the cd_min=5 vs.
# C_max*D_max=4 mismatch and nothing else in the section.

A_min = 0
A_max = 0
B_min = 0
B_max = 0

C_min = 2
C_max = 2
C = Set{c1,c2}

D_min = 2
D_max = 2
D = Set{d1,d2}

E_min = 1
E_max = 1
E = Set{e1}

F_min = 1
F_max = 1
F = Set{f1}

# The contradiction: with only 2 C objects and 2 D objects declared
# above, cd (an ordinary set-valued association) can hold at most
# C_max * D_max = 2 * 2 = 4 distinct (c,d) tuples -- there is no fifth
# distinct pair left to draw from this universe, however the solver
# tries. cd_min/cd_max = 5 requests exactly 5, which is therefore
# structurally impossible regardless of any other bound in this file.
cd_min = 5
cd_max = 5

ef = Set{(e1,f1)}

ab_min = 2
ab_max = 2
