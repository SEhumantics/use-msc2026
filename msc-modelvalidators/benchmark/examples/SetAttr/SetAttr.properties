# -----------------------------------------------------------------------
# SetAttr.properties -- unc-modelvalidator bounds for SetAttr.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) to give
# Set(Integer)-typed attributes with size bounds their wired benchmark
# coverage.
#
# [main] is SATISFIABLE: pool {1,2,3}, size bounds [1,2], tags 1 and 2
# forced by the membership invariants (set = {1,2}, cardinality 2 within
# bounds). hasTagThree is inactive.
#
# [unsat] is UNSATISFIABLE: ALL THREE membership invariants are active and
# the size bounds are [2,2] -- forcing tags {1,2,3} needs cardinality 3,
# which exceeds maxSize 2. A genuine cardinality contradiction over a fully
# populated model.
# -----------------------------------------------------------------------

[main]

Integer_min = 1
Integer_max = 3

Document_min = 1
Document_max = 1

Document_tags = Set{1,2,3}
Document_tags_minSize = 1
Document_tags_maxSize = 2

Document_hasTagOne = active
Document_hasTagTwo = active
Document_hasTagThree = inactive

[unsat]

Integer_min = 1
Integer_max = 3

Document_min = 1
Document_max = 1

Document_tags = Set{1,2,3}
Document_tags_minSize = 2
Document_tags_maxSize = 2

Document_hasTagOne = active
Document_hasTagTwo = active
Document_hasTagThree = active
