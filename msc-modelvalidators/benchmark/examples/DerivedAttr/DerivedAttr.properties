# -----------------------------------------------------------------------
# DerivedAttr.properties -- unc-modelvalidator bounds for DerivedAttr.use.
# Authored for this thesis project (msc-4, Trong-Nghia Be) to give the
# derived-attribute constraint (derive:) and the derived-attribute READ path
# their first wired corpus coverage: the derivation slices (crisp Integer,
# Boolean, Real-with-lift, String alias/literal) previously had only dedicated
# unit fixtures.
#
# [main] is SATISFIABLE: qty {2} + unitPrice {3} pins total to 5 (the
# derivation is a LINEAR sum -- a nonlinear product of two non-constant
# operands is outside the pinned QF_LIA/QF_LIRA fragment), which the
# configured total domain {5} agrees with, so positiveTotal (i.total > 0)
# holds; the String alias mirror derive: self.nickname over equal singleton
# domains {'alice'} holds.
#
# [unsat] is UNSATISFIABLE: unitPrice's domain is {4}, so the derivation pins
# total to 2 + 4 = 6 -- but total's configured domain stays {5}. The
# derivation constraint and the attribute domain now contradict each other: a
# genuine, non-vacuous contradiction over a fully populated model.
# -----------------------------------------------------------------------

[main]

Integer_min = 1
Integer_max = 10

Invoice_min = 1
Invoice_max = 1

Invoice_qty = Set{2}
Invoice_unitPrice = Set{3}
Invoice_total = Set{5}
Invoice_nickname = Set{'alice'}
Invoice_mirror = Set{'alice'}

Invoice_positiveTotal = active
Invoice_nicknamePresent = active

[unsat]

Integer_min = 1
Integer_max = 10

Invoice_min = 1
Invoice_max = 1

Invoice_qty = Set{2}
Invoice_unitPrice = Set{4}
Invoice_total = Set{5}
Invoice_nickname = Set{'alice'}
Invoice_mirror = Set{'alice'}

Invoice_positiveTotal = active
Invoice_nicknamePresent = active
