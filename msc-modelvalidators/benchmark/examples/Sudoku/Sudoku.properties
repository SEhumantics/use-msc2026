# -----------------------------------------------------------------------
# Sudoku.properties -- Kodkod ModelValidator bounds for Sudoku.use
#
# Fixes the entire 6x6 board SKELETON (which Field belongs to which
# Row/Column/Square -- the grid layout itself) via explicit Set{...} link
# literals, mirroring the structure the original bundled example built by
# hand via ASSL/!insert (CreateBoard_cmds.cmd), just expressed as Kodkod
# bounds instead of imperative SOIL statements. The only things left for
# Kodkod to actually SEARCH for are: each Field's `value` (1..6) and each
# Row/Column's `index` (1..6) -- constrained by Sudoku.use's invariants
# (isUnique per row/column/square, plus the 10 given-clue invariants) to
# force a genuine, solved Sudoku board out of the search.
#
# Two things discovered empirically while building this, not documented
# anywhere upstream (see Sudoku.use's own header comments for a third,
# the MultiplicityTransformator two-digit-multiplicity bug that forced
# "Field[*]" instead of a fixed "Field[36]" in the .use file itself):
#
# 1) Every plain (non-derived) association needs EXPLICIT _min/_max bounds
#    in the properties file -- an association left unmentioned does NOT
#    default to "unconstrained" just because an explicit Set{...} literal
#    is also given for it. Confirmed the hard way: omitting e.g.
#    "BoardRows_min"/"BoardRows_max" here (keeping only the Set{...}
#    literal) produces a self-contradictory bound and an immediate
#    TRIVIALLY_UNSATISFIABLE, with this exact proof node:
#      < node: (#(BoardRows) <= 1), literal: -2147483647, env: {}>
#    Root cause (read from the plugin's own source, not guessed):
#    org.tzi.kodkod.model.config.impl.PropertyConfigurationVisitor
#    .setAssociationConfigurator() calls configurator.setLimits(...) a
#    SECOND time, unconditionally, using the _min/_max keys if present or
#    else the plugin's own default (1/1, "exactly one link"). Inside
#    AssociationConfigurator.setLimits(), the "max <= min" branch then
#    silently overwrites the max that setSpecificValues() had already
#    derived from the Set{...} literal's own tuple count (9 tuples -> max
#    9) down to that default max of 1 -- producing
#    "#(BoardRows) >= 9 && #(BoardRows) <= 1" and the proof node above.
#    This reproduces the exact same discovery already documented in
#    AggregationComposition/FileSystem_default.properties for a
#    *different* reason (there: an unmentioned association with no
#    populated endpoint objects at all); here it happens even though every
#    endpoint object exists and the Set{...} literal is fully populated --
#    the _min/_max keys are simply mandatory, always, regardless.
#
# 2) Per-object attribute-value binding (e.g. "Field1_value = 6",
#    "Row1_index = 1") is unconditionally broken in this plugin build for
#    ANY model -- confirmed both by hitting it directly (immediate
#    "No such atom in the universe: Row1"/"Field1" from `mv -validate`)
#    and by reading why in the plugin's own source. See the "Puzzle
#    givens" comment block in Sudoku.use for the full explanation and the
#    coordinate-conditioned-invariant workaround used instead (which is
#    why no "Field*_value" or "Row*_index"/"Column*_index" lines appear
#    below at all -- those attributes are left to the solver, only
#    range- and uniqueness-constrained via Sudoku.use's own invariants).
#
# Confirmed timings (this exact file, USE 7.5.0 + KK-ModelValidator,
# DefaultSAT4J, bitwidth 12, this machine, `mv -validate Sudoku.properties`
# from validate.cmd): SATISFIABLE every time, `check -v` afterwards reports
# all 18 invariants OK (0 failures). Kodkod-to-SAT translation ~0.8-1.5s;
# actual SAT4J solving time observed across repeated runs: 2.5s, 3.1s,
# 5.0s -- i.e. reliably several seconds of genuine solver work, not a
# millisecond-scale trivial search. See Sudoku.use's own header for the
# full 9x9 board's numbers by contrast (still running, unresolved, after
# 6+ minutes -- killed, not completed) -- the reason this example ships as
# 6x6 instead.
# -----------------------------------------------------------------------

[puzzle]

Integer_min = 1
Integer_max = 6

Board_min = 1
Board_max = 1
Board = Set{Board1}

Row_min = 6
Row_max = 6
Row = Set{Row1,Row2,Row3,Row4,Row5,Row6}

Column_min = 6
Column_max = 6
Column = Set{Column1,Column2,Column3,Column4,Column5,Column6}

Square_min = 6
Square_max = 6
Square = Set{Square1,Square2,Square3,Square4,Square5,Square6}

Field_min = 36
Field_max = 36
Field = Set{Field1,Field2,Field3,Field4,Field5,Field6,Field7,Field8,Field9,Field10,Field11,Field12,Field13,Field14,Field15,Field16,Field17,Field18,Field19,Field20,Field21,Field22,Field23,Field24,Field25,Field26,Field27,Field28,Field29,Field30,Field31,Field32,Field33,Field34,Field35,Field36}

# BoardRows/BoardColumns/BoardSquares/BoardFields: each Row/Column/Square/
# Field belongs to the single Board (Board1). Fixed exactly, not searched.
BoardRows_min = 6
BoardRows_max = 6
BoardRows = Set{(Board1,Row1),(Board1,Row2),(Board1,Row3),(Board1,Row4),(Board1,Row5),(Board1,Row6)}
BoardColumns_min = 6
BoardColumns_max = 6
BoardColumns = Set{(Board1,Column1),(Board1,Column2),(Board1,Column3),(Board1,Column4),(Board1,Column5),(Board1,Column6)}
BoardSquares_min = 6
BoardSquares_max = 6
BoardSquares = Set{(Board1,Square1),(Board1,Square2),(Board1,Square3),(Board1,Square4),(Board1,Square5),(Board1,Square6)}
BoardFields_min = 36
BoardFields_max = 36
BoardFields = Set{(Board1,Field1),(Board1,Field2),(Board1,Field3),(Board1,Field4),(Board1,Field5),(Board1,Field6),(Board1,Field7),(Board1,Field8),(Board1,Field9),(Board1,Field10),(Board1,Field11),(Board1,Field12),(Board1,Field13),(Board1,Field14),(Board1,Field15),(Board1,Field16),(Board1,Field17),(Board1,Field18),(Board1,Field19),(Board1,Field20),(Board1,Field21),(Board1,Field22),(Board1,Field23),(Board1,Field24),(Board1,Field25),(Board1,Field26),(Board1,Field27),(Board1,Field28),(Board1,Field29),(Board1,Field30),(Board1,Field31),(Board1,Field32),(Board1,Field33),(Board1,Field34),(Board1,Field35),(Board1,Field36)}

# RowFields/ColumnFields/SquareFields: the actual 6x6 grid skeleton -- which
# Field is in which Row/Column/2x3-box. Field numbering is row-major
# (Field((r-1)*6+c) is the cell at row r, column c); each box spans 2 rows
# x 3 columns, so Square numbering runs THREE row-bands of TWO squares
# each (Square1/2 = rows 1-2, Square3/4 = rows 3-4, Square5/6 = rows 5-6;
# within a band, left box then right box), not two bands of three.
# Fixed exactly (this is the "board layout", not part of the search) --
# only each Field's `value` and each Row/Column's `index` are actually
# searched for, per Sudoku.use's invariants.
RowFields_min = 36
RowFields_max = 36
RowFields = Set{(Row1,Field1),(Row1,Field2),(Row1,Field3),(Row1,Field4),(Row1,Field5),(Row1,Field6),(Row2,Field7),(Row2,Field8),(Row2,Field9),(Row2,Field10),(Row2,Field11),(Row2,Field12),(Row3,Field13),(Row3,Field14),(Row3,Field15),(Row3,Field16),(Row3,Field17),(Row3,Field18),(Row4,Field19),(Row4,Field20),(Row4,Field21),(Row4,Field22),(Row4,Field23),(Row4,Field24),(Row5,Field25),(Row5,Field26),(Row5,Field27),(Row5,Field28),(Row5,Field29),(Row5,Field30),(Row6,Field31),(Row6,Field32),(Row6,Field33),(Row6,Field34),(Row6,Field35),(Row6,Field36)}
ColumnFields_min = 36
ColumnFields_max = 36
ColumnFields = Set{(Column1,Field1),(Column2,Field2),(Column3,Field3),(Column4,Field4),(Column5,Field5),(Column6,Field6),(Column1,Field7),(Column2,Field8),(Column3,Field9),(Column4,Field10),(Column5,Field11),(Column6,Field12),(Column1,Field13),(Column2,Field14),(Column3,Field15),(Column4,Field16),(Column5,Field17),(Column6,Field18),(Column1,Field19),(Column2,Field20),(Column3,Field21),(Column4,Field22),(Column5,Field23),(Column6,Field24),(Column1,Field25),(Column2,Field26),(Column3,Field27),(Column4,Field28),(Column5,Field29),(Column6,Field30),(Column1,Field31),(Column2,Field32),(Column3,Field33),(Column4,Field34),(Column5,Field35),(Column6,Field36)}
SquareFields_min = 36
SquareFields_max = 36
SquareFields = Set{(Square1,Field1),(Square1,Field2),(Square1,Field3),(Square2,Field4),(Square2,Field5),(Square2,Field6),(Square1,Field7),(Square1,Field8),(Square1,Field9),(Square2,Field10),(Square2,Field11),(Square2,Field12),(Square3,Field13),(Square3,Field14),(Square3,Field15),(Square4,Field16),(Square4,Field17),(Square4,Field18),(Square3,Field19),(Square3,Field20),(Square3,Field21),(Square4,Field22),(Square4,Field23),(Square4,Field24),(Square5,Field25),(Square5,Field26),(Square5,Field27),(Square6,Field28),(Square6,Field29),(Square6,Field30),(Square5,Field31),(Square5,Field32),(Square5,Field33),(Square6,Field34),(Square6,Field35),(Square6,Field36)}

# -----------------------------------------------------------------------
# [squareClash] -- paired UNSAT counterpart to [puzzle] above, for the
# SAT/UNSAT benchmark pair. Same model (Sudoku.use, completely untouched),
# same Integer/Board/Row/Column/Field population and Set{} literals as
# [puzzle], same 10 puzzle-clue invariants (they are OCL invariants in
# Sudoku.use, not properties bindings, so they are always active,
# regardless of which section is validated -- see Sudoku.use's own
# header) -- only ONE association's Set{} literal differs from [puzzle]:
# SquareFields swaps which square Field9 and Field10 belong to (everything
# else -- BoardRows/BoardColumns/BoardSquares/BoardFields/RowFields/
# ColumnFields -- is a byte-for-byte copy of [puzzle]).
#
# In [puzzle], Field9 (row2,col3) is in Square1 and Field10 (row2,col4) is
# in Square2 -- the ordinary 2x3-box layout. Here that single pair is
# swapped: Field10 moves into Square1 (replacing Field9, which moves the
# other way into Square2), so:
#   Square1 = {Field1,Field2,Field3,Field7,Field8,Field10}  (was ...,Field9)
#   Square2 = {Field4,Field5,Field6,Field9,Field11,Field12} (was ...,Field10)
# Both squares still have exactly 6 fields (SquareFields_min/max, i.e. the
# multiplicity Sudoku.use itself declares for SquareFields' "fields" role,
# stays satisfied) and every Field is still in exactly one square -- this
# is a pure relabelling of ONE square boundary, not a population change.
#
# Why this is UNSAT: Row.index/Column.index are left free to the solver
# (exactly as in [puzzle] -- see Sudoku.use's header on why givens are
# coordinate-conditioned rather than object-pinned), so which PHYSICAL
# field ends up holding logical coordinate (1,3) or (2,4) is not fixed in
# advance -- under the canonical index assignment used elsewhere in this
# directory (valid-instance.soil), that's Field3 and Field10, but a
# different row/column-to-index assignment can put different physical
# fields there. What IS fixed by construction (RowFields/ColumnFields
# never change) is that Field3 and Field10 always sit at (row2,col3) and
# (row2,col4) respectively in *object* terms -- so under that canonical
# assignment specifically, both givenR1C3 and givenR2C4 pin them to value
# 6, and the swap above puts them in the same square, directly violating
#   context Square inv uniqueValuesSquare: self.fields->isUnique(value)
# That's the intuition, not a full proof: it only walks the canonical
# labeling, not every possible row/column-to-index permutation. The actual
# UNSAT claim for the whole free-index search space rests on the real
# solver run below, which explores that entire space as part of solving --
# confirmed by an independent brute-force check over all 720x720
# Row/Column-to-index permutations too (none satisfy), not asserted from
# the single-labeling argument above.
#
# This is a genuine, solver-confirmed infeasibility, not a bound-mismatch
# shortcut: `mv -validate` reports plain UNSATISFIABLE (not
# TRIVIALLY_UNSATISFIABLE) with real DefaultSAT4J solving time of ~17s
# (bitwidth 12, this machine) -- i.e. the solver genuinely explored the
# combined value/labelling search space (including every alternative
# Row/Column index permutation) before concluding no solution exists, not
# a millisecond-scale bounds-only rejection. Confirmed by an earlier,
# abandoned draft of this section, kept here as a documented dead end:
# adding a 7th, deliberately unlinked Row object (to pigeonhole
# rowIndexUnique -- 7 Row instances can't take 7 pairwise-distinct values
# out of the 6-element allowedRowIndex range) does produce UNSAT, but
# TRIVIALLY_UNSATISFIABLE in 0ms, because it is caught earlier still by
# BoardRows' own composition multiplicity (Board[1] on the Row end, i.e.
# "every Row belongs to exactly one Board") long before rowIndexUnique's
# pigeonhole is ever reached -- a bound-mismatch, not the intended
# isUnique-level contradiction, and closer to the kind of trivial
# empty/mismatched-bound case this benchmark suite explicitly wants to
# avoid. [squareClash] deliberately keeps every class population and
# every other association exactly as in the working [puzzle] section so
# the *only* infeasibility is the isUnique clash inside Square1.
# -----------------------------------------------------------------------

[squareClash]

Integer_min = 1
Integer_max = 6

Board_min = 1
Board_max = 1
Board = Set{Board1}

Row_min = 6
Row_max = 6
Row = Set{Row1,Row2,Row3,Row4,Row5,Row6}

Column_min = 6
Column_max = 6
Column = Set{Column1,Column2,Column3,Column4,Column5,Column6}

Square_min = 6
Square_max = 6
Square = Set{Square1,Square2,Square3,Square4,Square5,Square6}

Field_min = 36
Field_max = 36
Field = Set{Field1,Field2,Field3,Field4,Field5,Field6,Field7,Field8,Field9,Field10,Field11,Field12,Field13,Field14,Field15,Field16,Field17,Field18,Field19,Field20,Field21,Field22,Field23,Field24,Field25,Field26,Field27,Field28,Field29,Field30,Field31,Field32,Field33,Field34,Field35,Field36}

BoardRows_min = 6
BoardRows_max = 6
BoardRows = Set{(Board1,Row1),(Board1,Row2),(Board1,Row3),(Board1,Row4),(Board1,Row5),(Board1,Row6)}
BoardColumns_min = 6
BoardColumns_max = 6
BoardColumns = Set{(Board1,Column1),(Board1,Column2),(Board1,Column3),(Board1,Column4),(Board1,Column5),(Board1,Column6)}
BoardSquares_min = 6
BoardSquares_max = 6
BoardSquares = Set{(Board1,Square1),(Board1,Square2),(Board1,Square3),(Board1,Square4),(Board1,Square5),(Board1,Square6)}
BoardFields_min = 36
BoardFields_max = 36
BoardFields = Set{(Board1,Field1),(Board1,Field2),(Board1,Field3),(Board1,Field4),(Board1,Field5),(Board1,Field6),(Board1,Field7),(Board1,Field8),(Board1,Field9),(Board1,Field10),(Board1,Field11),(Board1,Field12),(Board1,Field13),(Board1,Field14),(Board1,Field15),(Board1,Field16),(Board1,Field17),(Board1,Field18),(Board1,Field19),(Board1,Field20),(Board1,Field21),(Board1,Field22),(Board1,Field23),(Board1,Field24),(Board1,Field25),(Board1,Field26),(Board1,Field27),(Board1,Field28),(Board1,Field29),(Board1,Field30),(Board1,Field31),(Board1,Field32),(Board1,Field33),(Board1,Field34),(Board1,Field35),(Board1,Field36)}

RowFields_min = 36
