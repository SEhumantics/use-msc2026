RowFields = Set{(Row1,Field1),(Row1,Field2),(Row1,Field3),(Row1,Field4),(Row1,Field5),(Row1,Field6),(Row2,Field7),(Row2,Field8),(Row2,Field9),(Row2,Field10),(Row2,Field11),(Row2,Field12),(Row3,Field13),(Row3,Field14),(Row3,Field15),(Row3,Field16),(Row3,Field17),(Row3,Field18),(Row4,Field19),(Row4,Field20),(Row4,Field21),(Row4,Field22),(Row4,Field23),(Row4,Field24),(Row5,Field25),(Row5,Field26),(Row5,Field27),(Row5,Field28),(Row5,Field29),(Row5,Field30),(Row6,Field31),(Row6,Field32),(Row6,Field33),(Row6,Field34),(Row6,Field35),(Row6,Field36)}
ColumnFields_min = 36
