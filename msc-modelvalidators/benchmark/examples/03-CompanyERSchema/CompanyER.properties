# -----------------------------------------------------------------------
# [pkcollision] -- deliberately UNSATISFIABLE paired-mutation section.
#
# Same population scale as [small] everywhere EXCEPT two classes:
#
#  - Project is shrunk to a single object with its primary-key candidate
#    value set (Project_pname) shrunk right along with it, down to ONE
#    literal: Set{'Red'}. Project_min=Project_max=1 means exactly one
#    Project exists, so `project_name_foreign_key_Project`
#    (ProjectPart [*] -> Project [1] derived, i.e. `one(p|p.pname=
#    pp.projectname)`) forces pp.projectname='Red' on every single
#    ProjectPart object -- there is no other value it could legally take.
#  - ProjectPart's own required population is pushed to
#    ProjectPart_min=ProjectPart_max=4, i.e. 4 objects -- one MORE than
#    Part's population, which is left at [small]'s own Part_min=Part_max=3
#    (untouched, together with Component_min=Component_max=2, precisely so
#    Component::acyclic stays exactly as satisfiable as it already is in
#    [small] -- this section is not trying to also re-trigger the [one]-style
#    self-loop problem documented in the file header, only the PK/FK
#    collision below).
#
# Part's own PK invariant (pname_primary_key) already forces its 3 objects
# to carry 3 PAIRWISE DISTINCT pname values (chosen out of the 4-literal
# Part_pname candidate set, unchanged from [small]). `part_name_foreign_key_
# Part` (ProjectPart [*] -> Part [1] derived) then forces every ProjectPart
# object's partname to equal ONE of those exactly 3 achievable values --
# again, no other value is legal.
#
# Put together: all 4 ProjectPart objects are forced to share the same
# projectname ('Red', the sole surviving candidate of the shrunk Project
# primary key) and to draw partname from a pool of only 3 achievable
# values (bounded by Part's own, deliberately UNSHRUNK, population). That
# is 4 compound-key tuples drawn from a value space of size 1*3=3 -- a
# direct pigeonhole collision. `project_name_part_name_primary_key`
# (ProjectPart's own PK invariant, requiring pp1<>pp2 implies
# (projectname,partname) differ) can therefore never hold: two of the 4
# ProjectPart objects are structurally guaranteed to collide on
# (projectname, partname), regardless of which values Kodkod tries. This is
# exactly the "shrink a primary-key candidate value set below what a
# required foreign-key reference count needs" pattern -- Project's PK
# candidate set is what was shrunk (2 candidates in [small] down to 1
# here), and it is ProjectPart's *own* PK invariant, not some unrelated
# bound-mismatch, that is forced to fail. Every other class (Employee,
# Department, Dependent, Supplier, Part, Component, SupplierProjectPart,
# ProjectWork) keeps [small]'s exact 2-3-object-per-class population, so
# the rest of the instance is populated completely normally.
#
# Verified with the actual plugin (USE 7.5.0 + KK-ModelValidator,
# DefaultSAT4J, bitwidth 12, `mv -validate CompanyER.properties
# pkcollision`): UNSATISFIABLE.
# -----------------------------------------------------------------------

[pkcollision]

Integer_min = 0
Integer_max = 31

# --------------------------------------------------------------- Employee
Employee_min = 2
Employee_max = 2

Employee_fname = Set{'Ada','Bob','Cyd'}
Employee_lname = Set{'Alewife','Baker','Cook'}
Employee_dname_min = -1
Employee_dname_max = -1
Employee_salary = Set{3,6,9,12}

# ------------------------------------------------------------- Department
Department_min = 2
Department_max = 2

Department_dname = Set{'Accounting','Research','Billing'}
Department_budget = Set{20,25,30}

# -------------------------------------------------------------- Dependent
Dependent_min = 2
Dependent_max = 2

Dependent_dfname = Set{'Ali','Ben','Can'}
Dependent_fname_min = -1
Dependent_fname_max = -1
Dependent_lname_min = -1
Dependent_lname_max = -1
Dependent_age = Set{5,10,15}

# ---------------------------------------------------------------- Project
# Shrunk to a SINGLE object with a SINGLE primary-key candidate value --
# this is the primary-key candidate set being shrunk (see header note).
Project_min = 1
Project_max = 1

Project_pname = Set{'Red'}
Project_mnglname_min = -1
Project_mnglname_max = -1
Project_mngfname_min = -1
Project_mngfname_max = -1
Project_budget = Set{20,24,28}

# ------------------------------------------------------------ ProjectWork
ProjectWork_min = 2
ProjectWork_max = 2

ProjectWork_fname_min = -1
ProjectWork_fname_max = -1
ProjectWork_lname_min = -1
ProjectWork_lname_max = -1
ProjectWork_pname_min = -1
ProjectWork_pname_max = -1

# --------------------------------------------------------------- Supplier
Supplier_min = 2
Supplier_max = 2

Supplier_sname = Set{'IBM','SAP','Dell'}
Supplier_location = Set{'PA','NJ','GA'}

# ------------------------------------------------------------------- Part
# Deliberately UNCHANGED from [small] (still 3 objects / 4 candidates) --
# this is the required foreign-key reference count that ProjectPart below
# is pushed past. See header note: NOT shrunk, on purpose, so that
# Component::acyclic (which needs Part_max > Component_max, see [small]'s
# own header note) stays exactly as satisfiable as in [small].
Part_min = 3
Part_max = 3

Part_pname = Set{'Wheel','Gear','Chassis','Brake'}
Part_cost = Set{2,4,6,8}

# ------------------------------------------------------------ ProjectPart
# THE forcing change: 4 required objects, one more than the 3 achievable
# distinct partname values (bounded by Part's population above), with
# projectname collapsed to a single achievable value (bounded by Project's
# shrunk primary key above). 4 compound-key tuples, value space of size
# 1*3=3 -- see header note for the full pigeonhole argument.
ProjectPart_min = 4
ProjectPart_max = 4

ProjectPart_partname_min = -1
ProjectPart_partname_max = -1
ProjectPart_projectname_min = -1
ProjectPart_projectname_max = -1

# ---------------------------------------------------- SupplierProjectPart
# Left at [small]'s scale on purpose: with projectname bounded to 1
# achievable value and partname to 3, and suppliername to 2, this class's
# own compound PK has up to 1*3*2=6 achievable distinct triples to draw
# its 2 required objects from -- no collision forced here, so this class
# stays populated completely normally and the UNSAT stays isolated to
# ProjectPart's PK invariant alone.
SupplierProjectPart_min = 2
SupplierProjectPart_max = 2

SupplierProjectPart_partname_min = -1
SupplierProjectPart_partname_max = -1
SupplierProjectPart_projectname_min = -1
SupplierProjectPart_projectname_max = -1
SupplierProjectPart_suppliername_min = -1
SupplierProjectPart_suppliername_max = -1

# -------------------------------------------------------------- Component
# Deliberately UNCHANGED from [small] -- see Part note above.
Component_min = 2
Component_max = 2

Component_containername_min = -1
Component_containername_max = -1
Component_containedname_min = -1
Component_containedname_max = -1
# -------------------------------------------------------------------------
