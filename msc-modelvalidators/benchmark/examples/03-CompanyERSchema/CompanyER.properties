# -----------------------------------------------------------------------
# CompanyER.properties -- Kodkod ModelValidator bounds for CompanyER.use
#
# Adapted from chen_pk_fk.properties (Gogolla, COMLAN-274 artifact archive,
# University of Bremen DBIS group -- see attribution note in the example's
# README). The original file bounds every class to a single fixed
# population size per named section ([one]=1, [six]=6, [three]=3 with a
# 63-wide generic String/Integer domain, [twelve]=12, [sixteen]=16 -- the
# accompanying comment there literally says "-- heap space" next to
# [sixteen], i.e. the paper's own authors hit a scaling wall). None of
# those sections were used verbatim here:
#
#  - [one] (1 object per class, exactly as in the source) is UNSATISFIABLE
#    for this model: with exactly one Part and one Component, the sole
#    Component's containername/containedname FKs are both forced onto that
#    one Part, which is a direct self-loop and immediately violates the
#    Component::acyclic invariant. This is a genuine property of the model
#    (verified below by actually running the solver), not a copying error.
#  - [three]/[twelve]/[sixteen] additionally set String_min/max=0..63 with
#    no enumerated Set{} values for several attributes, letting the solver
#    invent arbitrary fresh strings up to 63 atoms wide on top of a >=12
#    object population -- confirmed far too large for a "few seconds"
#    example (see [six] below, which is smaller than these and already
#    takes several seconds).
#
# [small] below is a from-scratch scale-down: 2-3 objects per class,
# Part deliberately at 3 (one more than Component's 2) so the solver has
# room to build an acyclic Part-containment DAG instead of being forced
# into the [one]-style self-loop. Verified with the actual plugin
# (USE 7.5.0 + KK-ModelValidator, DefaultSAT4J, bitwidth 12):
# SATISFIABLE, ~21 objects total, solver time ~75ms, full `check -v`
# afterwards reports all 29 class invariants OK, 0 failures.
#
# [six] is kept as a second, named, opt-in section reproducing the
# source's own "six-per-class" scale (`mv -validate CompanyER.properties
# six`) for anyone wanting to compare against the original paper's
# numbers -- verified SATISFIABLE but noticeably slower (~6.5s solver time
# alone on this machine), so it is deliberately NOT the first/default
# section. `mv -validate CompanyER.properties` (no section name) resolves
# to the first section in the file, i.e. [small].
# -----------------------------------------------------------------------

