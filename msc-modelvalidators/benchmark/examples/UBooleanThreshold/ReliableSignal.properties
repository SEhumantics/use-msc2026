# The third U-type family: uncertain BOOLEANS, canonicalised to one truth probability each.
# archive2/robust_utype_model_finding_proposal.md's UBoolean section fixes the rules:
#     not(p) = 1 - p        p1 and p2 = p1 * p2
#     p1 or p2 = 1 - (1-p1)(1-p2)        toBooleanC(p, theta) <=> p >= theta
#
# The invariant deliberately uses the PRODUCT rule. `and` is nonlinear, this project pins
# QF_LIRA, and a symbolic product of two solver-chosen probabilities would be outside that
# logic. The proposal's own Version 1 mitigation is used instead -- "base confidence values
# constants or finite configured choices" -- so every combination of the configured choices
# is composed by USE's own UBoolean arithmetic at TRANSLATION time and the solver is only
# asked which choice was taken. Nothing arithmetic reaches the solver at all.
#
# Observed with the real org.tzi.use.uncertainty.datatypes.UBoolean:
#     0.9  and 0.89 = 0.801     below 0.81
#     0.9  and 0.9  = 0.81      the exact >= tie: 0.9*0.9 == 0.81 bit-for-bit
#     0.95 and 0.95 = 0.9025    above 0.81
#     0.5  and 0.5  = 0.25      0.5 and 0.9 = 0.45      0.9 and 0.5 = 0.45

# Nominal erasure reads both stored probabilities as plainly true (each is >= 0.5, USE's own
# toBoolean() rule), so the crisp reading accepts. The real uncertain conjunction is 0.801,
# under the 0.81 demanded, and the uncertainty-aware reading correctly rejects it.
[below]
Detection_min = 1
Detection_max = 1
Detection_hitsTarget_probability = Set{0.9}
Detection_isClear_probability = Set{0.89}
Detection_ReliableSignal = active

# Exactly ON the threshold. toBooleanC is defined with >=, and 0.9*0.9 is bit-identical to
# the literal 0.81, so this row is the tie itself rather than a near miss.
[at]
Detection_min = 1
Detection_max = 1
Detection_hitsTarget_probability = Set{0.9}
Detection_isClear_probability = Set{0.9}
Detection_ReliableSignal = active

[above]
Detection_min = 1
Detection_max = 1
Detection_hitsTarget_probability = Set{0.95}
Detection_isClear_probability = Set{0.95}
Detection_ReliableSignal = active

# The row that exists BECAUSE the rule is a product, and the one thing this family adds that
# neither UReal nor UInteger can state. Two candidate probabilities are offered per attribute,
# so there are four combinations and exactly one of them -- (0.9, 0.9) -- clears the threshold.
# The solver has to find it by choosing WHICH configured probabilities the snapshot carries,
# which is what the finite expansion buys in place of a symbolic multiplication.
[composition]
Detection_min = 1
Detection_max = 1
Detection_hitsTarget_probability = Set{0.5,0.9}
Detection_isClear_probability = Set{0.5,0.9}
Detection_ReliableSignal = active
