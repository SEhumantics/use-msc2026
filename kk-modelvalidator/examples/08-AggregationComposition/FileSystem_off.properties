# -----------------------------------------------------------------------
# FileSystem_off.properties -- Kodkod ModelValidator bounds for
# FileSystem.use, "OFF" config: aggregationcyclefreeness=off,
# forbiddensharing=off.
#
# Identical to FileSystem_default.properties in every respect EXCEPT the
# two Miscellaneous toggles -- same classes, same concrete object names,
# same population/link bounds (the Folder 2-hop cross-association cycle in
# [cycle], the doubly-owned MediaFile in [sharing]). The only thing that
# should change between this file and the default one is whether the
# solver is allowed to keep those forced structures in its reported
# solution. See FileSystem_default.properties for the two empirically
# discovered quirks (section independence; the "unmentioned association
# defaults to exactly one link" fallback) that shaped every bound below.
#
# With both toggles off, USE core's checkStructure() still detects the
# cycle / the shared object in the reconstructed diagram (that detection
# itself is not config-gated -- see MSystemState.checkWholePartLink), but
# the plugin no longer treats the detection as an error worth retrying
# over, so both sections are expected to come back SATISFIABLE, with the
# forced cycle / forced sharing visibly present in the found solution.
# Verified below (see validateOff.cmd) by actually running the solver.
# -----------------------------------------------------------------------

[cycle]

aggregationcyclefreeness = off
forbiddensharing = off

Integer_min = 1
Integer_max = 5

Folder_min = 2
Folder_max = 2
Folder = Set{f1,f2}
Folder_name = Set{'Root','Sub'}

# Same forced 2-hop cross-association cycle as the default file's [cycle]
# section.
PrimaryContains = Set{(f1,f2)}
AltContains = Set{(f2,f1)}

File_min = 0
File_max = 0
MediaFile_min = 0
MediaFile_max = 0
Archive_min = 0
Archive_max = 0

FolderHasFile_min = 0
FolderHasFile_max = 0
ArchiveHasMedia_min = 0
ArchiveHasMedia_max = 0

[sharing]

aggregationcyclefreeness = off
forbiddensharing = off

Integer_min = 1
Integer_max = 5

Folder_min = 1
Folder_max = 1
Folder = Set{f1}
Folder_name = Set{'Documents'}

Archive_min = 1
Archive_max = 1
Archive = Set{a1}
Archive_name = Set{'Backup'}

File_min = 0
File_max = 0

MediaFile_min = 1
MediaFile_max = 1
MediaFile = Set{m1}
File_name = Set{'clip.mp4'}
File_size = Set{1,2,3}
MediaFile_codec = Set{'h264','vp9'}

PrimaryContains_min = 0
PrimaryContains_max = 0
AltContains_min = 0
AltContains_max = 0

# Same forced double-ownership as the default file's [sharing] section.
FolderHasFile_min = 1
FolderHasFile_max = 1
ArchiveHasMedia = Set{(a1,m1)}
