/* Adapted from the "Constraint independence" use case in:
  M. Gogolla, F. Hilken, K.-H. Doan: "Achieving Model Quality through
  Model Validation, Verification and Exploration", Computer Languages,
  Systems & Structures (COMLAN), Database Systems Group, University of
  Bremen.

The paper's own protocol ran "mv -invIndep invIndep.properties all"
against the three base invariants only (Person::acyclicParenthood,
Person::nameUnique, Person::parentOlderChild) using bounds "the same as
for the constraint implication use case" (its broadConf: 0..6 Person,
0..* Parenthood). This file mirrors that with the same small,
synthetic-year bounds used elsewhere in this example. No config name is
needed on the command line since this file has a single, unnamed
section, matching the style of the paper's own invIndep.properties call:

  open genealogy.use
  mv -invIndep corleone_invIndep.properties all

Expected result (reported verbatim in the paper, and independently
checkable by hand -- see warnings): Person::acyclicParenthood => Not
Independent (parentOlderChild implies it: since yearB is drawn from a
finite total order, a cycle of strictly-increasing "+15 or more" steps
back to the same person is impossible); Person::nameUnique =>
Independent; Person::parentOlderChild => Independent.
*/

Integer_min = 0
Integer_max = 127

Person_min = 0
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 0
Parenthood_max = -1

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive
