/* Adapted (with much smaller bounds) from the Person/Parenthood
("Corleone family") examples in section "Validation and Verification
Use Cases" of:
  M. Gogolla, F. Hilken, K.-H. Doan: "Achieving Model Quality through
  Model Validation, Verification and Exploration", Computer Languages,
  Systems & Structures (COMLAN), Database Systems Group, University of
  Bremen. See the attribution note shipped with this example.

No working corleone.properties file exists in the source archive --
every section below is reconstructed from bound snippets quoted in the
paper's LaTeX prose and rescaled to solve in a few seconds. (The
paper's own 10..10 Person / 11..11 Parenthood config for "model
consistency" used real calendar years 1891-1953, needed an explicit
"mv -config bitwidth:=12" override, and its "property satisfiability"
run alone took about 16s of solving time -- all avoided here by using
small synthetic year numbers and fewer objects.)

Suggested USE shell session (only the "mv" alias, not "modelvalidator",
works when commands are read from a .cmd script file):

  open genealogy.use
  mv -validate corleone.properties consistency
  mv -validate corleone.properties satisfiability
  mv -validate corleone.properties implication_check
  mv -validate corleone.properties implication_sanity
  mv -validate corleone.properties equivalence_check
  mv -validate corleone.properties equivalence_one_check
  mv -scrollingAll corleone.properties scrolling
*/

[consistency]
# "Model consistency" use case (paper: 10 Person / 11 Parenthood,
# real years 1891-1953 -- scaled down here to 6 Person / 4..8 links,
# synthetic years). Expected result: SATISFIABLE.
Integer_min = 0
Integer_max = 127

Person_min = 6
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 4
Parenthood_max = 8

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[satisfiability]
# "Property satisfiability" use case (paper: 15 Person / 14 Parenthood
# links, a complete 4-level binary tree -- scaled down here to a
# complete 3-level binary tree: 7 Person / 6 Parenthood links).
# Expected result: SATISFIABLE.
Integer_min = 0
Integer_max = 127

Person_min = 7
Person_max = 7
Person_fName = Set{'Ada','Bob','Cyd','Dan'}
Person_lName = Set{'Alewife','Baker'}
Person_yearB = Set{0,20,40,60}

Parenthood_min = 6
Parenthood_max = 6

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = active
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[implication_check]
# "Constraint implication" use case, broad half of the paper's
# broadConf/narrowConf pair: negate grandparentOlderGrandchild.
# Expected result: UNSATISFIABLE (i.e. implied by the base invariants).
Integer_min = 0
Integer_max = 127

Person_min = 0
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 0
Parenthood_max = -1

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = negate
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[implication_sanity]
# Sanity-check half (paper's narrowConf): same invariant in its normal,
# non-negated form under an exact small bound. Expected result:
# SATISFIABLE -- confirms the "implication_check" UNSAT above was
# caused by the negation, not by an unrelated inconsistency.
Integer_min = 0
Integer_max = 127

Person_min = 4
Person_max = 4
Person_fName = Set{'Vito','Carmela','Sonny','Michael'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 4
Parenthood_max = 4

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = active
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[equivalence_check]
# "Equivalence implication" use case, narrow config (paper: 6 Person /
# 5 Parenthood links): negate the EQUIV invariant. Expected result:
# UNSATISFIABLE, i.e. parent_0_2_size and parent_0_2_Set really are
# equivalent formulations of "0..2 parents".
Integer_min = 0
Integer_max = 127

Person_min = 6
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 5
Parenthood_max = 5

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = active
Person_parent_0_2_Set = active
Person_parent_0_2_size_EQUIV_parent_0_2_Set = negate
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive

[equivalence_one_check]
# Same bounds, but negating the intentionally-broken "_ONE" variant
# (inner "exists" replaced by "one"). Expected result: SATISFIABLE, i.e.
# the model validator finds a genuine counterexample, as in the paper.
Integer_min = 0
Integer_max = 127

Person_min = 6
Person_max = 6
Person_fName = Set{'Vito','Carmela','Sonny','Michael','Kay','Mary'}
Person_lName = Set{'Corleone','Adams','Mancini'}
Person_yearB = Set{0,10,20,30,40,50}

Parenthood_min = 5
Parenthood_max = 5

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = active
Person_parent_0_2_Set = active
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = negate

[scrolling]
# "Solution interval exploration" use case (paper: 3 Person / 2
# Parenthood links, expected 6 solutions) -- kept at the paper's own
# tiny size, only the real years 1950/1965 replaced by 0/20.
Integer_min = 0
Integer_max = 127

Person_min = 3
Person_max = 3
Person_fName = Set{'Ada','Bob','Cyd'}
Person_lName = Set{'Alewife'}
Person_yearB = Set{0,20}

Parenthood_min = 2
Parenthood_max = 2

Person_nameUnique = active
Person_acyclicParenthood = active
Person_parentOlderChild = active
Person_grandparentOlderGrandchild = inactive
Person_balancedBinaryTree = inactive
Person_parent_0_2_size = inactive
Person_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set = inactive
Person_parent_0_2_size_EQUIV_parent_0_2_Set_ONE = inactive
