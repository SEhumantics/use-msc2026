# -----------------------------------------------------------------------
# CompanyER_invIndep.properties -- bounds for `mv -invIndep` on CompanyER.use
#
# Adapted from chen_pk_fk_invIndep.properties (same source archive as
# CompanyER.properties -- see the example's README/attribution note).
# The original file uses a single unnamed section with 0..6 objects per
# class; this version keeps that same "flexible range, no section name"
# shape (so `mv -invIndep CompanyER_invIndep.properties all` needs no
# section argument, exactly like the source's own
# "mv -invIndep chen_pk_fk_invIndep.properties all") but narrows the
# ranges to 0..3 per class (0..4 for Part, for the same acyclic-DAG
# headroom reason documented in CompanyER.properties) instead of 0..6.
#
# Verified with the actual plugin (USE 7.5.0 + KK-ModelValidator,
# DefaultSAT4J, bitwidth 12): `mv -invIndep CompanyER_invIndep.properties
# all` checks all 29 class invariants in ~2.5s total. Result actually
# observed (not assumed): most invariants come back Independent, but
# several come back "Not independent for given properties" --
# Employee::dname_foreign_key_Department, ProjectPart::part_name_foreign_key_Part,
# Component::container_name_foreign_key_Part, Employee::salary_positive,
# Department::budget_positive, Dependent::age_reasonable, Part::cost_positive,
# and Project::ProjectBudget_greater_PartCost. Take "not independent" here
# at face value as a solver-reported fact about this bounded search space
# (0..3/0..4 objects, the enumerated Set{} domains below) -- it is NOT
# necessarily a general theorem about the unbounded model, and a human
# should double-check *why* before citing it (e.g. in the small bounded
# universe, some of these may be entangled with the enumerated attribute
# domains rather than genuinely logically implied). This is exactly the
# kind of surprising result `-invIndep` is meant to surface for further
# inspection, not a claim this file's author fully explains.
# -----------------------------------------------------------------------

