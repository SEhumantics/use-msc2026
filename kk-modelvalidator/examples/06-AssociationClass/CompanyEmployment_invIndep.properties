# ---------------------------------------------------------------------------
# CompanyEmployment_invIndep.properties -- bounds for `mv -invIndep` on
# CompanyEmployment.use
#
# Deliberately a SEPARATE file from CompanyEmployment.properties (same
# convention as 03-CompanyERSchema/04-CivilStatus): -invIndep needs to
# actually be able to construct a *counterexample* when it negates one
# invariant, so the enumerated attribute domains here straddle every
# invariant's threshold on purpose --
#
#   - Employment_salary includes values both <= 0 (to test PositiveSalary's
#     negation) and >= every Company_budget value (to test
#     SalaryBelowEmployerBudget's negation).
#   - Employment_startDate includes a negative value (to test
#     StartDateNotNegative's negation).
#
# CompanyEmployment.properties, by contrast, only needs ONE witness for
# -validate/SATISFIABLE and deliberately keeps every attribute
# domain positive/non-negative throughout -- fine for finding a single
# satisfying instance, but it would make -invIndep's independence checks
# vacuous (a negated invariant would be UNSAT purely because no violating
# *value* exists in the domain at all, not because another invariant
# forces it) -- exactly the kind of domain-restriction artifact this file
# exists to avoid.
#
# Person/Company/Employment are all given as 0..2 ranges (flexible, not
# fixed) -- same "flexible range, no section name" shape as
# CompanyER_invIndep.properties -- so `mv -invIndep
# CompanyEmployment_invIndep.properties all` needs no section argument.
# ---------------------------------------------------------------------------

Integer_min = -3
Integer_max = 12

# ----------------------------------------------------------------- Person
Person_min = 0
Person_max = 2

Person_name = Set{'Ada','Bob'}

# ---------------------------------------------------------------- Company
Company_min = 0
Company_max = 2

Company_name = Set{'Acme','Globex'}
Company_budget = Set{4,8}

# -------------------------------------------------------------- Employment
Employment_min = 0
Employment_max = 2

Employment_salary = Set{-2,0,2,6,10}
Employment_startDate = Set{-1,0,1,3}
# -------------------------------------------------------------------------
