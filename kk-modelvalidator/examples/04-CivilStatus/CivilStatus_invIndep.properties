# CivilStatus_invIndep.properties -- tuned for `mv -invIndep`
# (model: kk-modelvalidator/examples/04-CivilStatus/CivilStatus.use)
#
# Same universe as CivilStatus.properties, widened slightly (Person_max 4->5,
# Marriage_max 2->3, one extra name) so an independence search has enough
# room to actually exhibit a counterexample diagram when an invariant IS
# independent, instead of reporting "independent" only because the bound was
# too tight to find one.
#
# Good invariants to point `-invIndep` at here: femaleHasNoWife constrains
# only the "husband" role-slot of Marriage (females may not occupy it) and
# maleHasNoHusband constrains only the disjoint "wife" role-slot (males may
# not occupy it) -- they restrict different tuples of the same association,
# so each should come back independent of the other and of nameIsUnique.
# That is a different (complementary) story to 02-EmployeeInvariants'
# invIndep demo, which instead shows one invariant that is NOT independent.

Integer_min = -2
Integer_max = 8

Person_min = 2
Person_max = 5
Person_name = Set{'Ann','Bob','Cid','Dee','Eve'}

Marriage_min = 0
Marriage_max = 3

Person_attributesDefined = active
Person_nameIsUnique = active
Person_femaleHasNoWife = active
Person_maleHasNoHusband = active

# See CivilStatus.properties for why this is inactive: substring/size on
# String are not supported by this plugin's OCL-to-Kodkod transformer, so
# the invariant never reaches the model at all regardless of this setting --
# there is nothing for -invIndep to check the independence of here.
Person_nameCapitalThenSmallLetters = inactive
