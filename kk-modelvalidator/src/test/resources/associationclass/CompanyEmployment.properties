# ---------------------------------------------------------------------------
# CompanyEmployment.properties -- Kodkod ModelValidator bounds for
# CompanyEmployment.use
#
# Bounds for the association class (Employment) work exactly like an
# ordinary class -- Employment_min/_max below sets BOTH the number of
# Employment objects (read by the class configurator, key "Employment_min"/
# "Employment_max") AND the number of links of the underlying association
# (read by the association configurator, key "Employment_min"/"Employment_max"
# again) -- confirmed by reading PropertyConfigurationVisitor.setClassConfigurator
# / setAssociationConfigurator: both read "<name>_min"/"<name>_max" off the
# class/association name, and an association class's association shares the
# class's own name (see ModelTransformator.transformAssociationClasses,
# which passes mAssociationClass.name() to both factory.createAssociationClass
# and transformAssociation). Since an Employment instance IS simultaneously
# the object and the link, this coincidence is exactly correct -- there is
# only one count to bound, not two.
#
# [small] keeps the population tiny (2 Person, 2 Company, 0..2 Employment)
# so the solver only has to decide which of at most 4 possible
# (Person,Company) pairs actually gets an Employment link, subject to the
# Company[0..1]-per-Person cap -- small enough to solve in well under a
# second (confirmed below).
# ---------------------------------------------------------------------------

[small]

Integer_min = 0
Integer_max = 15

# ----------------------------------------------------------------- Person
Person_min = 2
Person_max = 2

Person_name = Set{'Ada','Bob'}

# ---------------------------------------------------------------- Company
Company_min = 2
Company_max = 2

Company_name = Set{'Acme','Globex'}
Company_budget = Set{6,9,12}

# -------------------------------------------------------------- Employment
# 0..2 so the solver can also try the "nobody employed" / "one employed"
# corners of the space, not just "everybody employed".
Employment_min = 0
Employment_max = 2

Employment_salary = Set{2,4,6,8}
Employment_startDate = Set{0,1,2,3}
# -------------------------------------------------------------------------
